# An example hyprland.conf for running Talaris — a starting point, not a
# requirement. Written for Hyprland 0.53.
#
# Talaris does not edit your hyprland.conf. ./install.sh writes its own file
# beside it, ~/.config/hypr/talaris.conf, and one `source =` line here (at the
# end of this file) is what turns Talaris on; take the line out and Hyprland
# is as it was.
#
# Much of what a hyprland.conf usually does, Talaris does itself, at runtime,
# from Settings — so it is left out of this file on purpose. Each is listed
# below with what to leave out of your own config, and why.

# ---------------------------------------------------------------- yours

# Monitors: yours to describe. A fractional scale works; Talaris reads it.
monitor = , preferred, auto, 1.25

# Talaris draws pages in Qt; the surfaces read this for their own scale.
# Match it to the monitor's scale above.
env = QT_SCALE_FACTOR, 1.25
env = XCURSOR_SIZE, 24

input {
    kb_layout = us
    # 1: focus follows the pointer, which Talaris's panels expect. Talaris
    # puts this back to 1 if it finds it at 2.
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    # Gaps, border size and border colours are Talaris's (Settings, Windows),
    # set when it starts and whenever they change; anything here is replaced.
    layout = dwindle
}

decoration {
    # Window corners and shadows are yours. Talaris's own panels round and
    # shade themselves.
    rounding = 10
    shadow {
        enabled = true
        range = 5
    }
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    # Leave `screen_shader` out for rounded screen corners: Talaris draws
    # them (Settings, Look, Screen corners). A shader that rounds them runs on
    # part of a frame when Hyprland repaints only what changed, and leaves
    # half-drawn corners behind.
}

# Window animations are Talaris's (Settings, Windows: slide, pop, fade, draw,
# none, and how fast); set at start, they replace what is here.
animations {
    enabled = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# The media keys: keep them here. Talaris binds them again while it runs, to
# show the level as they change, and puts these back when it stops — so the
# keys never go dead.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Your own keys: whatever is yours, as long as it is not one of Talaris's.
$mod = SUPER
bind = $mod, Return, exec, ghostty
bind = $mod, Q, killactive
bind = $mod, F, togglefloating
# Fills the screen but keeps the bar (maximized, not fullscreen).
bind = $mod SHIFT, F, fullscreenstate, 1 -1
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Talaris's keys — leave these free. It binds them itself, so they work
# whatever is on the screen:
#   Super+Space          the launcher: find anything, or ask
#   Super+Tab            the projects (again for the next one); Space, Home
#   Super+Escape         put everything away; a fullscreen window back in its place
#   Super+V              clipboard history
#   Super+Shift+C / W    the canvas / the writing drawer
#   Super+Shift+M        Morgan
#   Super+Shift+N        New: a task, an event, a person, a note, a project
#   Super+Shift+G        Glance at this project
#   the lid switch       while Talaris holds it (Settings, Power)
#
# Projects are desktops Talaris names and moves between, with a slide. Leave
# out Super+1…9 workspace binds: a jump straight to a numbered workspace goes
# round Talaris (no slide, and the bar does not hear which project you are in).

# Window rules: yours. Two that are commonly wanted:
windowrule {
    # Ignore apps asking to be maximized; Talaris's tiling decides.
    name = no-maximize-requests
    match:class = .*
    suppress_event = maximize
}

# ---------------------------------------------------------------- leave out

# Talaris is the bar, the dock, the launcher, notifications and the OSD, so
# do not start another of each: no waybar, eww, ags, Noctalia; no wofi, rofi,
# fuzzel; no mako, dunst, swaync (Talaris holds the notification bus);
# no swayosd. Three helpers stay, and need no exec-once lines here:
# hyprpaper (the wallpaper) and hyprpolkitagent (password prompts) are
# started through talaris.conf; hypridle Talaris runs itself, with its own
# settings (Settings, Power), and it locks with hyprlock.

# ---------------------------------------------------------------- Talaris

# Last, so Talaris's file has the final word on what it sets.
source = ~/.config/hypr/talaris.conf

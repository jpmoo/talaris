The Files panel (files_panel.py, DESIGN *Files*): every file in the projects,
and what Talaris holds for them, each saying what it is. Projects, tags and
kept views down the left; the files, by folder, type or date, in the middle;
the one chosen, and what can be done with it, on the right. Up over a dimmed
screen from the bar's Files button; a window by its grow button.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris files</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<style>
/* As People's: a panel over the dimmed screen; a window, the whole surface. */
html { background: rgba(0, 0, 0, .32); overflow: hidden; height: 100%; }
html:not([data-window]) { cursor: pointer; }
body { cursor: default; position: relative; }
body {
  width: min(1180px, calc(100% - 32px)); height: 82vh; margin: 9vh auto 0; display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); color: var(--text); border: 1px solid var(--frame); border-radius: 12px;
  box-shadow: var(--menu-shadow); overflow: hidden;
}
html[data-window] { background: var(--surface); }
html[data-window] body { width: 100%; height: 100%; margin: 0; box-shadow: none; border: 0; border-radius: 0; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
header h1 { font-size: 15px; font-weight: 500; margin: 0 2px 0 4px; letter-spacing: .3px; flex: none; }
header .spacer { flex: 1; }
header .t-btn { white-space: nowrap; flex: none; }
header .seg { flex: none; }
header .seg button { padding: 2px 10px !important; font-size: 12px; }
header .icon-btn[hidden], header .t-btn[hidden] { display: none !important; }
header .icon-btn:hover { color: var(--accent) !important; border-color: var(--accent) !important; }
/* The one that does it, in a sheet. */
.t-btn.primary { border-color: var(--accent) !important; color: var(--accent) !important; background: var(--accent-wash) !important; }
#count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
#msg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 40%; }
#msg.err { color: var(--danger); }
#q { width: 180px; flex: 0 1 180px; min-width: 90px; padding: 4px 8px; font-size: 12.5px; }

main { flex: 1; min-height: 0; display: flex; position: relative; }
.empty { color: var(--muted); padding: 24px; font-size: 13px; }

/* The left: projects, tags, kept views. */
#side { width: 200px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 6px 0 10px; }
.s-head { padding: 10px 14px 4px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.s-head { display: flex; align-items: center; }
/* A section's heading folds it: the twist turned while it is open. */
.s-head.fold { cursor: pointer; user-select: none; gap: 4px; padding-left: 8px; }
.s-head.fold:hover { color: var(--text); }
.s-head.fold .tw { transform: rotate(90deg); }
.s-head.fold.shut .tw { transform: none; }
.s-head .s-title { flex: 1; }
.s-item .tw { flex: none; }
.s-item .tw.none { visibility: hidden; }
.s-add { margin-left: auto; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; line-height: 1; padding: 0 2px; cursor: pointer; }
.s-add:hover { color: var(--accent); }
.d-lists { margin-top: 6px; }
.d-lists .d-sub { width: 100%; }
.s-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 14px; color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer; }
.s-item:hover { background: var(--accent-wash); }
.s-item.on { color: var(--accent); background: var(--accent-wash); }
.s-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-item .here { font-size: 10px; color: var(--muted); }
.s-item .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.s-item.on .n { color: inherit; }
.s-item .x { color: var(--muted); padding: 0 2px; visibility: hidden; }
.s-item:hover .x { visibility: visible; }
.s-keep { margin: 6px 14px 0; font-size: 11.5px !important; padding: 1px 8px !important; }

/* The middle: the files, in groups. */
#rows { flex: 1; min-width: 0; overflow: auto; outline: none; padding-bottom: 12px; }
.g-head { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; gap: 6px; align-items: baseline; padding: 10px 14px 4px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.g-head .n { letter-spacing: 0; }
.row { user-select: none; display: grid; grid-template-columns: 18px minmax(12ch, 1fr) auto 18px 92px 110px 64px; gap: 10px; align-items: center; padding: 4px 14px; cursor: pointer; font-size: 12.5px; }
.row:hover { background: var(--accent-wash); }
.row.on { background: var(--accent-wash); box-shadow: inset 2px 0 0 var(--accent); }
.row .ic { width: 16px; height: 16px; border-radius: 3px; font-size: 9px; display: grid; place-items: center; color: var(--surface); font-weight: 600; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm .where { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
.row .date, .row .size { color: var(--muted); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.gone .nm { color: var(--muted); text-decoration: line-through; }
/* The tree: a twist before each row that holds others; folders as rows of their own. */
.row.tree { grid-template-columns: 12px 18px minmax(12ch, 1fr) auto 18px 92px 110px 64px; }
.row.tree.dir { display: flex; gap: 8px; color: var(--muted); }
.row.tree.dir .nm { flex: 1; color: var(--text); }
.row.tree.dir .n { font-size: 11px; font-variant-numeric: tabular-nums; }
.row .dir-ic { color: var(--muted); background: none; width: 16px; height: 16px; }
.row .dir-ic svg { width: 16px; height: 16px; }
.tw { width: 12px; color: var(--muted); font-size: 13px; line-height: 1; display: inline-block; transition: transform .12s; text-align: center; }
.tw.open { transform: rotate(90deg); }
/* Dragging: onto a list on the left, and into an order in a list shown. */
.s-item.drop { background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent); }
.row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.marks { display: flex; gap: 4px; justify-content: flex-end; white-space: nowrap; max-width: 46ch; min-width: 0; overflow: hidden; }
.marks .mk { flex: none; }
.marks .mk.on { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* What a row is: said in words, each in its own color. */
.mk { font-size: 10px; letter-spacing: .5px; padding: 0 6px; border-radius: 8px; border: 1px solid currentColor; line-height: 15px; }
.mk.folder { display: none; }
.mk.page { color: var(--muted); }
.mk.shortcut, .mk.linked { color: var(--accent); }
.mk.snapshot { color: #c7a55a; }
.mk.missing { color: var(--danger); }
.mk.unread { color: var(--muted); border-style: dashed; }
.book { width: 16px; height: 16px; display: inline-flex; }
.row .type { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-about { width: 100%; box-sizing: border-box; font: inherit; font-size: 12px; line-height: 1.45; resize: vertical; padding: 6px 8px; }
.d-about-acts { display: flex; justify-content: flex-end; margin-top: 4px; }
.d-about-acts:empty, .d-about-acts .t-btn[hidden] { display: none; }
.d-who { margin-left: 8px; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 10.5px; }
.book svg { width: 15px; height: 15px; }
.book.waiting { color: var(--muted); opacity: .6; }
.book.read { color: #6aa86a; }
.book.nowords, .book.unreadable { color: var(--danger); }
.d-said { white-space: pre-wrap; font-size: 12px; line-height: 1.45; color: color-mix(in srgb, var(--text) 85%, var(--muted)); max-height: 220px; overflow: auto;
  padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
.s-watch { display: flex; align-items: center; gap: 4px; cursor: default; }
.s-watch .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.s-x { flex: none; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; }
.s-x:hover { color: var(--danger); }
.mk.on, .mk.tag { color: var(--muted); border-color: transparent; padding: 0 2px; }

/* The right: the one chosen. */
#detail { width: 300px; flex: none; border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px; font-size: 12.5px; }
#detail h2 { font-size: 14px; font-weight: 500; margin: 0 0 4px; overflow-wrap: anywhere; }
.d-status { color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
.d-status b { font-weight: 500; color: var(--text); }
.d-status .bad { color: var(--danger); }
.d-line { display: flex; gap: 8px; margin: 3px 0; }
.d-line .k { color: var(--muted); width: 64px; flex: none; }
.d-line .v { min-width: 0; overflow-wrap: anywhere; }
.d-proj { all: unset; cursor: pointer; color: inherit; border-bottom: 1px dotted var(--muted); }
.d-proj:hover { color: var(--accent); border-bottom-style: solid; }
.d-dim { color: var(--muted); }
.d-sub { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.d-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.d-acts .t-btn { font-size: 12px; padding: 2px 10px; }
.d-acts .t-btn.danger { color: var(--danger) !important; }
.d-acts .t-btn.armed { border-color: var(--danger) !important; background: color-mix(in srgb, var(--danger) 12%, transparent) !important; }
.on-item { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 3px 6px; border-radius: var(--radius-row); color: var(--text); font: inherit; cursor: pointer; }
.on-item:hover { background: var(--accent-wash); color: var(--accent); }
.on-item .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; padding: 1px 2px 1px 8px; border-radius: 10px; background: var(--accent-wash); }
.chip button { border: 0 !important; padding: 0 5px !important; color: var(--muted) !important; background: transparent !important; }
.tag-in { width: 120px; padding: 2px 6px; font-size: 12px; }
.inline { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.inline input[type="text"] { flex: 1; min-width: 120px; padding: 3px 6px; font-size: 12.5px; }
.pick-list { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; max-height: 120px; overflow: auto; }
.pick-list .t-btn { font-size: 11.5px !important; padding: 1px 9px !important; }
.pick-list .t-btn.on { border-color: var(--accent) !important; color: var(--accent) !important; background: var(--accent-wash) !important; }

/* Bringing files in: the sheet that asks, with what moving would disturb. */
#sheet { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0, 0, 0, .25); }
#sheet[hidden] { display: none; }
.sheet { width: min(560px, calc(100% - 40px)); max-height: 80%; overflow: auto; background: var(--surface); border: 1px solid var(--frame); border-radius: 10px; padding: 16px 18px; box-shadow: var(--menu-shadow); font-size: 13px; }
.sheet h3 { margin: 0 0 10px; font-size: 14px; font-weight: 500; }
.sheet .file { margin: 10px 0; }
.sheet .file .fn { font-weight: 500; }
.sheet .file .from { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
.sheet ul { margin: 6px 0 0; padding-left: 18px; color: var(--danger); font-size: 12px; }
.sheet ul.fine { color: var(--muted); }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* Something dragged over: it will be taken (asked as a shortcut or moved in). */
body.dropping::after { content: "Drop to add them here"; position: absolute; inset: 52px 0 0; display: grid; place-items: center; font-size: 13px; letter-spacing: 1px;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border: 2px dashed var(--accent); border-radius: 0 0 12px 12px; pointer-events: none; }

@media (max-width: 1000px) { header .seg#days { display: none; } }
@media (max-width: 860px) { #detail { width: 240px; } #side { width: 160px; } #q { width: 120px; flex-basis: 120px; } .row { grid-template-columns: 18px minmax(0, 1fr) auto 18px 90px; } .row.tree { grid-template-columns: 12px 18px minmax(0, 1fr) auto 18px 90px; } .row .type { display: none; } .row .size { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Files</h1>
  <span id="count"></span>
  <input type="text" id="q" placeholder="Find by name" spellcheck="false">
  <span class="seg" id="view"></span>
  <span class="seg" id="days" title="When it changed"></span>
  <span class="seg" id="readf" title="Whether it is read for search: green, or grey and red"></span>
  <span id="msg"></span>
  <span class="spacer"></span>
  <button class="t-btn" id="bring" title="Files from anywhere in your home folder: as shortcuts (left where they are), or moved into the project">Add from elsewhere…</button>
  <button class="t-btn" id="reveal" title="This project's folder in the file manager">Open in Files</button>
  <button class="icon-btn" id="grow"></button>
  <button class="icon-btn" id="close"></button>
</header>
<main>
  <aside id="side"></aside>
  <section id="rows" tabindex="0"></section>
  <section id="detail"></section>
</main>
<div id="sheet" hidden></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="pagetips.js"></script>
<script src="icons.js"></script>
<script src="surface.js"></script>
<script src="motion.js"></script>
<script src="peek.js"></script>
<script src="filespanel.js"></script>
</body>
</html>

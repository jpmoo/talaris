<!doctype html>
<!--

Copyright (c) 2026 Jeff Moore

What drops from the bar: the power menu, the volume. One page, shown as one or
the other; the surface around it is sized to whichever is up.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris popup</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
/* A menu panel (controls.css), filling the surface but for a margin its
   shadow can fall into. */
.panel { position: absolute; inset: 4px 18px 26px; display: none; flex-direction: column; }
/* A dropdown is a panel from the bar too: as see-through as Settings, Panels says. */
.panel.menu { background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent) !important; }
body[data-popup="power"] #power, body[data-popup="volume"] #volume,
body[data-popup="network"] #network, body[data-popup="bluetooth"] #bluetooth,
body[data-popup="tray"] #tray, body[data-popup="trayicons"] #trayicons, body[data-popup="battery"] #battery, body[data-popup="projects"] #projects, body[data-popup="notifications"] #notifications { display: flex; }
.menu .hint { align-items: center; }

/* Wi-Fi and Bluetooth: a list that scrolls, things you can do under it. */
.list { flex: 1; min-height: 0; overflow: auto; }
.list .menu-item { justify-content: flex-start; }
/* A tray item's own menu: its entries as it gives them, a tick or a dot for
   a toggle, a submenu's entries under its name, set in. */
#tray-menu .menu-item { justify-content: flex-start; gap: 8px; }
/* The battery's panel: the level large, then what is worth knowing, in pairs. */
.bat-big { display: flex; align-items: baseline; gap: 10px; padding: 2px 10px 6px; }
#bat-level { font-size: 26px; color: var(--text); font-variant-numeric: tabular-nums; }
#bat-when { font-size: 12px; color: var(--muted); }
#bat-rows .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 10px; font-size: 12.5px; }
#bat-rows .kv span:first-child { color: var(--muted); }
#bat-profiles { display: flex; gap: 4px; padding: 6px 10px 2px; }
#bat-profiles:empty { display: none; }
#project-list .menu-item { justify-content: space-between; }
#project-list .menu-item .code { font-size: 10px; letter-spacing: 2px; color: var(--muted); }
#project-list .menu-item { align-items: center; gap: 10px; }
#project-list .menu-item .thumb { width: 72px; height: 45px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); background: var(--desk); flex: none; }
#project-list .menu-item .pname { flex: 1; text-align: left; }
#project-list .menu-item.current { color: var(--accent) !important; }
#bat-profiles button { flex: 1; font-size: 12px; padding: 3px 6px !important; }
#bat-profiles button.on { border-color: var(--accent) !important; color: var(--accent) !important; background: var(--accent-wash) !important; }
/* The folded tray's pane: the icons in a row that wraps. */
#tray-icons { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 6px 6px; }
#tray-icons button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--radius-control); background: none; cursor: pointer; }
#tray-icons button:hover { border-color: var(--line); }
#tray-icons button.attention { border-color: var(--accent); }
#tray-icons img { width: 20px; height: 20px; display: block; }
#tray-menu .mark { width: 12px; flex: none; color: var(--accent); text-align: center; }
#tray-menu .sub { padding-left: 14px; }
#tray-menu .head { padding: 6px 10px 2px; font-size: 11px; color: var(--muted); }
.list .menu-item .ic { width: 16px; height: 16px; flex: none; }
.list .menu-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .menu-item .meta { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; flex: none; }
.list .menu-item.current .nm { color: var(--accent); }
.list .menu-item.busy { opacity: .6; cursor: progress; }
.list .label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; padding: 8px 10px 2px; }
.list .none { font-size: 12px; color: var(--muted); padding: 4px 10px 8px; }
/* What a chosen row opens: a password, or what can be done to it. */
.detail { display: flex; gap: 6px; align-items: center; padding: 2px 10px 8px 34px; flex-wrap: wrap; }
.detail input { flex: 1; min-width: 0; padding: 3px 8px; font-size: 13px; }
.detail .t-btn { font-size: 12px !important; padding: 1px 10px !important; }
.detail .t-btn.armed { color: var(--danger) !important; border-color: var(--danger) !important; }
.foot { display: flex; gap: 6px; padding: 6px 6px 2px; }
.foot .t-btn { font-size: 12px !important; }
.err { color: var(--danger); font-size: 12px; padding: 2px 10px; min-height: 0; }
.err:empty { display: none; }
.menu .hint { display: flex; justify-content: space-between; }

/* Asking twice: the row says what it is about to do, in the danger color. */
.menu-item.armed, .menu-item.armed:hover { color: var(--danger) !important; background: color-mix(in srgb, var(--danger) 12%, transparent) !important; }

#volume .row { display: flex; align-items: center; gap: 10px; padding: 6px 10px 4px; }
#level { flex: 1; }
/* A slider drawn to match: a hairline track, the accent up to the level. */
input[type="range"] { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--fill, 0%), var(--line) var(--fill, 0%));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--accent);
}
/* The bell's list: newest first, each the app, when, what it said, and what
   can be done about it. Unread when the list was opened: an accent rule. */
#notice-clear { border: 0 !important; padding: 0 !important; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); background: none; cursor: pointer; }
#notice-clear:hover { color: var(--accent); }
#notice-clear[hidden] { display: none; }
.notice { padding: 7px 10px 8px 10px; border-left: 2px solid transparent; border-radius: var(--radius-row); }
.notice + .notice { border-top: 1px solid var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
.notice.unread { border-left-color: var(--accent); }
.notice .top { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
.notice .top img, .notice .top .ic { width: 16px; height: 16px; flex: none; display: block; object-fit: contain; }
.notice .app { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice .when { flex: none; font-variant-numeric: tabular-nums; }
.notice .x { flex: none; border: 0 !important; padding: 0 !important; width: 18px; height: 18px; display: grid; place-items: center; color: var(--muted); background: none; }
.notice .x:hover { color: var(--accent); }
.notice .x svg { width: 10px; height: 10px; }
.notice .sum { font-weight: 600; font-size: 13px; color: var(--text); margin-top: 4px; overflow-wrap: anywhere; }
.notice .body { font-size: 12.5px; color: var(--text); opacity: .85; margin-top: 2px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.notice .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.notice .acts:empty { display: none; }
.notice .acts .t-btn { font-size: 11.5px !important; padding: 1px 9px !important; }
#vol-n { width: 30px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body data-popup="">
<div class="panel menu" id="power">
  <div class="hint"><span>Power</span></div>
  <button class="menu-item" data-verb="lock">Lock</button>
  <button class="menu-item" data-verb="suspend">Suspend</button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-verb="logout" data-ask="Log out — again to confirm">Log out</button>
  <button class="menu-item" data-verb="restart" data-ask="Restart — again to confirm">Restart</button>
  <button class="menu-item" data-verb="shutdown" data-ask="Shut down — again to confirm">Shut down</button>
</div>
<div class="panel menu" id="projects">
  <div class="hint"><span>Projects</span></div>
  <div id="project-list"></div>
</div>
<div class="panel menu" id="notifications">
  <div class="hint"><span>Notifications</span><button id="notice-clear" hidden>Clear all</button></div>
  <div class="list" id="notice-list"></div>
</div>
<div class="panel menu" id="battery">
  <div class="hint"><span>Battery</span><span id="bat-state"></span></div>
  <div class="bat-big"><span id="bat-level"></span><span id="bat-when"></span></div>
  <div id="bat-rows"></div>
  <div id="bat-profiles"></div>
  <div class="menu-sep"></div>
  <button class="menu-item" id="bat-settings">Power settings…</button>
</div>
<div class="panel menu" id="trayicons">
  <div class="hint"><span>Tray</span></div>
  <div id="tray-icons"></div>
</div>
<div class="panel menu" id="tray">
  <div class="hint"><span id="tray-title"></span></div>
  <div id="tray-menu"></div>
</div>
<div class="panel menu" id="volume">
  <div class="hint"><span>Volume</span><span id="vol-state"></span></div>
  <div class="row"><input type="range" id="level" min="0" max="100" step="1"><span id="vol-n"></span></div>
  <div class="row"><button class="t-btn" id="mute">Mute</button></div>
</div>
<div class="panel menu" id="network">
  <div class="hint"><span>Wi-Fi</span><button class="switch" id="wifi-on" title="Wi-Fi on or off"></button></div>
  <div class="list" id="nets"></div>
  <div class="err" id="net-err"></div>
  <div class="menu-sep"></div>
  <div class="foot"><button class="t-btn" id="rescan">Rescan</button><button class="t-btn" id="net-more">More settings</button></div>
</div>
<div class="panel menu" id="bluetooth">
  <div class="hint"><span>Bluetooth</span><button class="switch" id="bt-on" title="Bluetooth on or off"></button></div>
  <div class="list" id="devs"></div>
  <div class="err" id="bt-err"></div>
  <div class="menu-sep"></div>
  <div class="foot"><button class="t-btn" id="scan">Find devices</button><button class="t-btn" id="bt-more">More settings</button></div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="icons.js"></script>
<script src="surface.js"></script>
<script src="popup.js"></script>
</body>
</html>

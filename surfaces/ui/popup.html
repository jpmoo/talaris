What drops from the bar: the power menu, the volume. One page, shown as one or
the other; the surface around it is sized to whichever is up.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris popup</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
/* A menu panel (controls.css), filling the surface but for a margin its
   shadow can fall into. */
.panel { position: absolute; inset: 4px 22px 30px; display: none; flex-direction: column; }
/* A dropdown is a panel from the bar too: as see-through as Settings, Panels says. */
.panel.menu { background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent) !important; }
body[data-popup="power"] #power, body[data-popup="volume"] #volume,
body[data-popup="network"] #network, body[data-popup="bluetooth"] #bluetooth,
body[data-popup="tray"] #tray, body[data-popup="trayicons"] #trayicons, body[data-popup="battery"] #battery, body[data-popup="projects"] #projects, body[data-popup="notifications"] #notifications, body[data-popup="clipboard"] #clipboard, body[data-popup="weather"] #weather { display: flex; }
.menu .hint { align-items: center; }

/* Wi-Fi and Bluetooth: a list that scrolls, things you can do under it. */
.list { flex: 1; min-height: 0; overflow: auto; }
.list .menu-item { justify-content: flex-start; }
/* A tray item's own menu: its entries as it gives them, a tick or a dot for
   a toggle, a submenu's entries under its name, set in. */
#tray-menu .menu-item { justify-content: flex-start; gap: 8px; }
/* The battery's panel: the level large, then what is worth knowing, in pairs. */
.bat-big { display: flex; align-items: baseline; gap: 10px; padding: 2px 10px 6px; }
#bat-level { font-size: 26px; color: var(--text); font-variant-numeric: tabular-nums; }
#bat-when { font-size: 12px; color: var(--muted); }
.sys { padding: 0 10px 4px; font-size: 12px; }
.sys-row { display: flex; justify-content: space-between; margin-top: 4px; }
.sys-l { color: var(--muted); }
.sys-v { font-variant-numeric: tabular-nums; }
.spark { display: block; width: 100%; height: 26px; margin-top: 2px; border-radius: var(--radius-row); background: color-mix(in srgb, var(--muted) 10%, transparent); }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.spark polygon { fill: var(--accent-strong); stroke: none; }
.sys-top { margin-top: 6px; display: grid; grid-template-columns: 1fr auto auto; gap: 1px 10px; font-variant-numeric: tabular-nums; }
.sys-top .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sys-top .m { color: var(--muted); text-align: right; }
.sys-top .c { text-align: right; }
.sys-top .head { color: var(--muted); font-size: 11px; }
#bat-rows .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 10px; font-size: 12.5px; }
#bat-rows .kv span:first-child { color: var(--muted); }
#bat-profiles { align-self: flex-start; margin: 6px 10px 2px; }
/* The weather: now, large; then the hours or the days, a row each, scrolling. */
.wx-now { display: flex; align-items: center; gap: 12px; padding: 4px 10px 10px; }
.wx-now .ic { width: 34px; height: 34px; color: var(--accent); }
.wx-now .t { font-size: 28px; color: var(--text); font-variant-numeric: tabular-nums; }
.wx-now .s { display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); }
.wx-now .s b { font-weight: 500; color: var(--text); }
#wx-rows { flex: 1; min-height: 0; overflow: auto; }
.wx-row { display: grid; grid-template-columns: 76px 20px 1fr auto; align-items: center; gap: 8px; padding: 4px 10px; font-size: 12.5px;
  border-radius: var(--radius-row); font-variant-numeric: tabular-nums; }
.wx-row:hover { background: var(--accent-wash); }
.wx-row .when { color: var(--muted); }
.wx-row .ic { width: 16px; height: 16px; }
.wx-row .sky { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wx-row .temp { color: var(--text); text-align: right; }
.wx-row .temp .lo { color: var(--muted); margin-left: 6px; }
.wx-row .rain { color: var(--accent); font-size: 11px; margin-left: 6px; }
#bat-profiles:empty { display: none; }
#project-list { overflow-y: auto; overscroll-behavior: contain; }
#project-list .menu-item { justify-content: space-between; }
#project-list .menu-item .code { font-size: 10px; letter-spacing: 2px; color: var(--muted); }
#project-list .menu-item { align-items: center; gap: 10px; }
#project-list .menu-item .thumb { width: 72px; height: 45px; object-fit: cover; border-radius: var(--radius-row); border: 1px solid var(--line); background: var(--desk); flex: none; }
#project-list .menu-item .pname { flex: 1; text-align: left; }
/* The folded tray's pane: the icons in a row that wraps. */
#tray-icons { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 6px 6px; }
#tray-icons button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--radius-control); background: none; cursor: pointer; }
#tray-icons button:hover { background: var(--accent-hover); }
#tray-icons button.attention { border-color: var(--accent); }
#tray-icons img { width: 20px; height: 20px; display: block; }
#tray-menu .sub { padding-left: 14px; }
.list .menu-item .ic { width: 16px; height: 16px; flex: none; }
.list .menu-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .menu-item .meta { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; flex: none; }
.list .menu-item.busy { opacity: .6; cursor: progress; }
/* What a chosen row opens: a password, or what can be done to it. */
.detail { display: flex; gap: 6px; align-items: center; padding: 2px 10px 8px 34px; flex-wrap: wrap; }
.detail input { flex: 1; min-width: 0; }
.foot { display: flex; gap: 6px; padding: 6px 6px 2px; }
.err { font-size: 12px; padding: 2px 10px; min-height: 0; }
.err:empty { display: none; }
.menu .hint { display: flex; justify-content: space-between; }

#volume .row { display: flex; align-items: center; gap: 10px; padding: 6px 10px 4px; }
#level { flex: 1; }
/* The bell's list: newest first, each the app, when, what it said, and what
   can be done about it. Unread when the list was opened: an accent rule. */
#notice-clear, #clip-clear { border: 0 !important; padding: 0 !important; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); background: none; cursor: pointer; }
#notice-clear:hover, #clip-clear:hover { color: var(--accent); }
#notice-clear[hidden], #clip-clear[hidden] { display: none; }
/* Clipboard history (clipboard.js): Notchnik's grid of square tiles, when under each. */
#clip-q { margin: 2px 10px 8px; }
#clip-grid { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px 10px 6px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; align-content: start; }
#clip-grid .kit-empty { grid-column: 1 / -1; }
#clipboard .cell { min-width: 0; }
#clipboard .clip { position: relative; aspect-ratio: 1; border: 1px solid var(--line); border-radius: var(--radius-row); overflow: hidden;
  background: color-mix(in srgb, var(--muted) 7%, transparent); cursor: pointer; transition: border-color var(--dur); }
#clipboard .clip:hover, #clipboard .clip.at { border-color: var(--accent-line); }
#clipboard .clip.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#clipboard .face { position: absolute; inset: 0; }
#clipboard .face.words { padding: 8px 9px; font-size: 11.5px; line-height: 1.32; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 14; -webkit-box-orient: vertical; }
#clipboard .face.picture img { width: 100%; height: 100%; object-fit: cover; display: block; }
#clipboard .face.files { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; text-align: center; }
#clipboard .face.files .ic { width: 34px; height: 34px; color: var(--muted); }
#clipboard .face.files.picture { justify-content: flex-end; padding: 0; }
#clipboard .face.files.picture img { position: absolute; inset: 0; }
#clipboard .fname { position: relative; font-size: 11.5px; color: var(--text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#clipboard .face.picture .fname { width: 100%; padding: 3px 6px; background: color-mix(in srgb, var(--surface) 80%, transparent); }
#clipboard .fmore { font-size: 10.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#clipboard .tools { position: absolute; inset: 4px 4px auto; display: flex; gap: 3px; opacity: 0; transition: opacity var(--dur); }
#clipboard .clip:hover .tools, #clipboard .clip.at .tools { opacity: 1; }
#clipboard .tools .gap { flex: 1; }
#clipboard .tool { border: 0 !important; padding: 0 !important; width: 22px; height: 22px; display: grid; place-items: center; border-radius: var(--radius-row);
  color: var(--muted); background: color-mix(in srgb, var(--surface) 88%, transparent) !important; }
#clipboard .tool:hover { color: var(--accent); }
#clipboard .tool svg { width: 13px; height: 13px; }
#clipboard .tool.armed { width: auto; padding: 0 6px !important; font-size: 10.5px; }
/* A pinned tile always shows its pin. */
#clipboard .clip.pinned .tools { opacity: 1; }
#clipboard .clip.pinned:not(:hover):not(.at) .tools > :not(.pin) { visibility: hidden; }
#clipboard .tool.pin.on { color: var(--accent); }
#clipboard .stale { position: absolute; left: 6px; bottom: 6px; color: var(--accent); }
#clipboard .stale svg { width: 14px; height: 14px; display: block; }
#clipboard .copied { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--accent); background: color-mix(in srgb, var(--surface) 82%, transparent); opacity: 0; pointer-events: none; transition: opacity var(--dur); }
#clipboard .clip.flash .copied { opacity: 1; }
#clipboard .when { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 3px; font-variant-numeric: tabular-nums; }
#clip-look { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; border-radius: inherit;
  background: color-mix(in srgb, var(--surface) 97%, transparent); }
#clip-look[hidden] { display: none; }
#clip-look-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 12px 12px; }
#clip-look-body pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 12.5px; color: var(--text); }
#clip-look-body img { max-width: 100%; border-radius: var(--radius-row); display: block; margin-bottom: 8px; }
#clip-look-body .path { font-size: 12px; color: var(--text); overflow-wrap: anywhere; padding: 2px 0; }
.notice { padding: 7px 10px 8px 10px; border-left: 2px solid transparent; border-radius: var(--radius-row); }
.notice + .notice { border-top: 1px solid var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
.notice.unread { border-left-color: var(--accent); }
.notice .top { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.notice .top img, .notice .top .ic { width: 16px; height: 16px; flex: none; display: block; object-fit: contain; }
.notice .app { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice .when { flex: none; font-variant-numeric: tabular-nums; }
.notice .sum { font-weight: 500; font-size: 14px; color: var(--text); margin-top: 4px; overflow-wrap: anywhere; }
.notice .body { font-size: 13px; color: var(--text); margin-top: 2px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.notice .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.notice .acts:empty { display: none; }
#timers[hidden] { display: none; }
.timer { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 10px; border-left: 2px solid var(--accent); border-radius: var(--radius-row); }
/* The bar that empties as the time runs out, as in Morgan's panel. */
.timer .bar { flex: 0 0 100%; }
.timer .bar[hidden] { display: none; }
.timer .bar > i { width: calc(var(--left, 0) * 100%); transition: width 1s linear; }
.timer + .timer { margin-top: 2px; }
.timer .ic { width: 16px; height: 16px; flex: none; color: var(--accent); }
.timer .what { flex: 1; min-width: 0; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer .what small { display: block; font-size: 11px; color: var(--muted); }
.timer .left { flex: none; font-size: 13px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.timer .t-btn { flex: none; }
#timers + .hint { margin-top: 6px; }
#vol-n { width: 30px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
<link rel="stylesheet" href="kit.css">
</head>
<body data-popup="">
<div class="panel menu" id="power">
  <!-- How the machine is doing: the last minute, read each second while this is open (sysmon.py). -->
  <div class="hint"><span>This machine</span></div>
  <div class="sys" id="sys">
    <div class="sys-row"><span class="sys-l">CPU</span><span class="sys-v" id="sys-cpu-v"></span></div>
    <svg class="spark" id="sys-cpu" viewBox="0 0 60 20" preserveAspectRatio="none"><polygon></polygon><polyline></polyline></svg>
    <div class="sys-row"><span class="sys-l">Memory</span><span class="sys-v" id="sys-mem-v"></span></div>
    <svg class="spark" id="sys-mem" viewBox="0 0 60 20" preserveAspectRatio="none"><polygon></polygon><polyline></polyline></svg>
    <div class="sys-row"><span class="sys-l">Swap</span><span class="sys-v" id="sys-swap-v"></span></div>
    <div class="sys-row"><span class="sys-l">Load</span><span class="sys-v" id="sys-load-v"></span></div>
    <div class="sys-top" id="sys-top"></div>
  </div>
  <div class="menu-sep"></div>
  <div class="hint"><span>Power</span></div>
  <button class="menu-item" data-verb="lock">Lock</button>
  <button class="menu-item" data-verb="suspend">Suspend</button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-verb="logout" data-ask="Log out?">Log out</button>
  <button class="menu-item" data-verb="restart" data-ask="Restart?">Restart</button>
  <button class="menu-item" data-verb="shutdown" data-ask="Shut down?">Shut down</button>
</div>
<div class="panel menu" id="projects">
  <button class="menu-item" id="glance-here">Glance at current project</button>
  <div class="menu-sep"></div>
  <div id="project-list"></div>
  <div class="menu-sep"></div>
  <button class="menu-item" id="archive-open">Archive…</button>
</div>
<div class="panel menu" id="notifications">
  <div id="timers" hidden>
    <div class="hint"><span>Coming up</span></div>
    <div id="timer-list"></div>
  </div>
  <div class="hint"><span>Notifications</span><button id="notice-clear" hidden>Clear all</button></div>
  <div class="list" id="notice-list"></div>
</div>
<div class="panel menu" id="clipboard">
  <div class="hint"><span>Clipboard</span><button id="clip-clear" hidden>Clear all</button></div>
  <input type="search" id="clip-q" placeholder="Find" autocomplete="off" spellcheck="false">
  <div id="clip-grid"></div>
  <div id="clip-look" hidden>
    <div class="hint"><span>Clip</span><span id="clip-look-when"></span></div>
    <div id="clip-look-body"></div>
  </div>
</div>
<div class="panel menu" id="battery">
  <div class="hint"><span>Battery</span><span id="bat-state"></span></div>
  <div class="bat-big"><span id="bat-level"></span><span id="bat-when"></span></div>
  <div id="bat-rows"></div>
  <div class="seg" id="bat-profiles"></div>
  <div class="menu-sep"></div>
  <button class="menu-item" id="bat-settings">Power settings…</button>
</div>
<div class="panel menu" id="weather">
  <div class="hint"><span>Weather</span><span class="seg" id="wx-mode"></span></div>
  <div class="wx-now" id="wx-now"></div>
  <div id="wx-rows"></div>
</div>
<div class="panel menu" id="trayicons">
  <div class="hint"><span>Tray</span></div>
  <div id="tray-icons"></div>
</div>
<div class="panel menu" id="tray">
  <div class="hint"><span id="tray-title"></span></div>
  <div id="tray-menu"></div>
</div>
<div class="panel menu" id="volume">
  <div class="hint"><span>Volume</span><span id="vol-state"></span></div>
  <div class="row"><input type="range" id="level" min="0" max="100" step="1"><span id="vol-n"></span></div>
  <div class="row"><button class="t-btn" id="mute">Mute</button></div>
</div>
<div class="panel menu" id="network">
  <div class="hint"><span>Wi-Fi</span><button class="switch" id="wifi-on" title="Wi-Fi on or off"></button></div>
  <div class="list" id="nets"></div>
  <div class="err" id="net-err"></div>
  <div class="menu-sep"></div>
  <div class="foot"><button class="t-btn" id="rescan">Rescan</button><button class="t-btn" id="net-more">More settings</button></div>
</div>
<div class="panel menu" id="bluetooth">
  <div class="hint"><span>Bluetooth</span><button class="switch" id="bt-on" title="Bluetooth on or off"></button></div>
  <div class="list" id="devs"></div>
  <div class="err" id="bt-err"></div>
  <div class="menu-sep"></div>
  <div class="foot"><button class="t-btn" id="scan">Find devices</button><button class="t-btn" id="bt-more">More settings</button></div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="icons.js"></script>
<script src="pagetips.js"></script>
<script src="surface.js"></script>
<script src="kit.js"></script>
<script src="popup.js"></script>
<script src="clipboard.js"></script>
</body>
</html>

The Tasks panel (tasks_panel.py, DESIGN *Tasks*): lists and projects down the
left, the one chosen on the right, a task opened in a sheet beside it. Up over
a dimmed screen from the bar's Tasks button; a window by its grow button. The
page's three parts and what each may call are in TASKS-CONTRACT.md.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris tasks</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="listeditor.css">
<link rel="stylesheet" href="taskviews.css">
<style>
/* As the calendar's: a panel over the dimmed screen; a window, the whole surface. */
html { background: var(--catch); overflow: hidden; height: 100%; }
/* The dim is a button: a press there closes it — the bar's button under it included. */
html:not([data-window]) { cursor: pointer; }
body { cursor: default; position: relative; }
body {
  width: min(1040px, calc(100% - 32px)); height: 82vh; margin: 9vh auto 0; display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); color: var(--text); border: 1px solid var(--frame); border-radius: var(--radius-panel);
  box-shadow: var(--menu-shadow); overflow: hidden;
}
/* A window: the whole of it, no dim, no frame of its own — Hyprland draws one. */
html[data-window] { background: var(--surface); }
html[data-window] body { width: 100%; height: 100%; margin: 0; box-shadow: none; border: 0; border-radius: 0; }

header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
header h1 { font-size: 15px; font-weight: 500; margin: 0 2px 0 4px; letter-spacing: .3px; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .t-btn { white-space: nowrap; flex: none; }
header .spacer { flex: 1; }
#search { width: 190px; flex: 0 1 190px; min-width: 90px; font-size: 12.5px; }
header .icon-btn[hidden], header .t-btn[hidden] { display: none !important; }
header .icon-btn:hover { color: var(--accent) !important; border-color: var(--accent) !important; }
header .icon-btn.on { color: var(--accent) !important; }
#count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
#msg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#msg.err { color: var(--danger); }
body.no-side #side { display: none; }

main { flex: 1; min-height: 0; display: flex; position: relative; }

/* The left column: lists, then projects. */
#side { width: 210px; flex: none; border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; font-size: 13px; }
#side h3 { display: flex; align-items: center; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 16px 4px 6px; font-weight: 400; }
#side h3:first-child { margin-top: 0; }
#side h3 span { flex: 1; }
.add { border: 0 !important; padding: 0 6px !important; font-size: 15px; line-height: 1; color: var(--muted); border-radius: var(--radius-row) !important; }
.add:hover { color: var(--accent); background: var(--accent-wash); }
.item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: var(--radius-row); cursor: pointer; }
.item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item:hover { background: var(--accent-hover); }
.item.on { background: var(--accent-wash); color: var(--accent); }
.item input, #side .new { width: 100%; font-size: 13px; }

/* The right: quick add over what is shown. */
#view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#quick-bar { padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
#quick { width: 100%; font-size: 13px; }
#quick .cm-content { padding: 5px 8px; }
#rows { flex: 1; min-height: 0; overflow: auto; }

/* The list view. */
.list { display: flex; flex-direction: column; }
.ghead { display: flex; align-items: center; gap: 6px; padding: 10px 14px 4px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.ghead:hover { color: var(--text); }
.ghead .n { letter-spacing: 0; }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 14px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); cursor: pointer; }
.row:hover { background: var(--accent-hover); }
.row.on { background: var(--accent-wash); color: var(--accent); }
.row .num { color: var(--muted); font-size: 12px; min-width: 18px; text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
.r-main { flex: 1; min-width: 0; }
.r-title { font-size: 13.5px; overflow-wrap: anywhere; }
.r-body { font-size: 12px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.meta .overdue { color: var(--danger); }
.row.done .r-title { text-decoration: line-through; color: var(--muted); }
.row.done { opacity: var(--done); }
.fmt-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 12px; }
.fmt-cards .ghead { grid-column: 1 / -1; padding: 6px 2px 0; }
.fmt-cards .row { border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--paper); padding: 10px 12px; }

/* A task's status: a round checkbox, or a chip in its color (.tv-status, taskviews.css). */
.row .tv-status { flex: none; white-space: nowrap; }
.nostat { width: 16px; flex: none; }

/* The task's sheet: beside the list, not over everything. */
#sheet, #psheet { width: 340px; flex: none; border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 12.5px;
         background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); }
#sheet[hidden], #psheet[hidden], #psheet [hidden] { display: none !important; }
.s-head { display: flex; align-items: center; gap: 8px; }
.s-head input { flex: 1; font-size: 14px; padding: 5px 8px; }
@media (max-width: 760px) { #sheet, #psheet { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; background: var(--surface); box-shadow: var(--menu-shadow); } }
#p-desc { width: 100%; min-height: 90px; font-size: 12.5px; flex: none; }
#p-desc .cm-content { padding: 6px 8px; min-height: 76px; }
#p-sugg:empty { display: none; }
#p-name:disabled { background: none; border-color: transparent; color: inherit; }
/* Projects in groups (Tasks' own, talaris:group): a folding heading, its projects under it. */
#side .item .name { flex: 1; min-width: 0; }
#side .item .synced { flex: none; color: var(--muted); font-size: 12px; }
/* What a plugin asks here (asks, in tasks.js): its groups, each question and its answers. */
.asks { width: min(460px, 86vw); max-height: 70vh; overflow-y: auto; padding: 4px 2px; display: flex; flex-direction: column; gap: 10px; }
.asks-head { font-weight: 500; padding: 2px 8px 4px; }
.ask { padding: 6px 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.ask-q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask-d { color: var(--muted); font-size: 12px; }
.ask-acts { display: flex; flex-wrap: wrap; gap: 6px; }
#side .item.on .synced { color: var(--accent); }
#side .item .more { border: 0 !important; background: transparent !important; padding: 0 4px !important; line-height: 1; color: var(--muted); visibility: hidden; flex: none; }
#side .item:hover .more, #side .item.on .more { visibility: visible; }
#side .item .more:hover { color: var(--accent); }
#side .item.grp { color: var(--muted); font-size: 12px; gap: 6px; }
#side .item.grp:hover { color: var(--text); }
#side .item.grp .kit-caret { flex: none; }
#side .item.grp .n { flex: none; font-size: 11px; font-variant-numeric: tabular-nums; }
#side .item.proj .n { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
#side .item.proj.on .n { color: inherit; }
#side .item.in-group { padding-left: 22px; }
/* Below the last of the column: a place to drop something last, in no group. */
.col-end { height: 14px; }
/* A project, in its panel on the right. */
.ps-new { width: 180px; }
.ps-wall { align-items: flex-start; flex-wrap: nowrap; gap: 10px; }
.ps-thumb { width: 120px; height: 75px; object-fit: cover; flex: none; border: 1px solid var(--line); border-radius: var(--radius-row); background: var(--desk); }
.ps-wall-side { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.ps-wall-acts { display: flex; gap: 6px; }
</style>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="thingcard.css">
</head>
<body data-arrives>
<header>
  <button class="icon-btn" id="side-toggle"></button>
  <h1 id="title"></h1>
  <span id="count"></span>
  <span id="msg"></span>
  <span class="spacer"></span>
  <input type="search" id="search" placeholder="Find tasks" spellcheck="false" title="Find in every task (Ctrl+F)">
  <button class="t-btn" id="asks" hidden title="Waiting for you to choose"></button>
  <span id="list-actions"></span>
  <button class="t-btn" id="edit-list" hidden>Edit collection</button>
  <button class="t-btn" id="add-task" title="A new task, opened to name it (n, for the quick line)">+ Task</button>
  <button class="icon-btn" id="grow"></button>
  <button class="icon-btn" id="close"></button>
</header>
<main>
  <aside id="side"></aside>
  <section id="view">
    <div id="quick-bar"><div id="quick" class="ed-field"></div></div>
    <div id="rows"></div>
  </section>
  <aside id="sheet" hidden></aside>
  <!-- A project chosen on the left: itself — its description, what it might be connected to, Glance. -->
  <aside id="psheet" hidden>
    <div class="s-head">
      <input type="text" id="p-name" spellcheck="false" title="Its name: Enter keeps it">
      <button class="icon-btn" id="p-close" title="Close"></button>
    </div>
    <div class="s-row"><span class="lab">Open tasks</span><span class="sum" id="p-open"></span></div>
    <div class="s-row"><span class="lab">Group</span><span id="p-group"></span></div>
    <div class="s-row top" id="p-wall-row"><span class="lab">Wallpaper</span><span class="ps-wall" id="p-wall"></span></div>
    <div class="s-row"><span class="lab">About it</span><span class="sum" id="p-who"></span></div>
    <div id="p-desc" class="ed-field"></div>
    <div id="p-sugg"></div>
    <div class="s-foot"><span id="p-acts"></span><span class="spacer"></span><button class="t-btn" id="p-archive" title="Its folder to the archive, and out of every list; brought back from the archive">Archive</button></div>
  </aside>
</main>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="pagetips.js"></script>
<script src="icons.js"></script>
<script src="surface.js"></script>
<script src="kit.js"></script>
<script src="motion.js"></script>
<script src="palette.js"></script>
<script src="listeditor.js"></script>
<script src="taskviews.js"></script>
<script src="peek.js"></script>
<script src="mentions.js"></script>
<script src="thingcard.js"></script>
<script src="taskcard.js"></script>
<script src="tasks.js"></script>
</body>
</html>

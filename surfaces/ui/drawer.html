One drawer: a handle when filed, a panel when out or pulled. The same page in
every mode — the surface around it is what moves between layers, and the page
keeps its state across that.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talaris drawer</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="motion.css">
<style>
#handle { display: none; position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--frame); align-items: center; justify-content: center; color: var(--muted); }
body[data-edge="left"] #handle { border-left: 0; border-radius: 0 9px 9px 0; }
body[data-edge="right"] #handle { border-right: 0; border-radius: 9px 0 0 9px; }
body[data-edge="top"] #handle { border-top: 0; border-radius: 0 0 9px 9px; }
body[data-edge="bottom"] #handle { border-bottom: 0; border-radius: 9px 9px 0 0; }
#handle:hover { color: var(--accent); border-color: var(--accent); cursor: pointer; }
#handle .grip { width: 2px; height: 22px; background: currentColor; border-radius: 1px; }
body[data-edge="top"] #handle .grip, body[data-edge="bottom"] #handle .grip { width: 22px; height: 2px; }
/* Close: a round control at the header's far end, set apart by a hairline. */
.ends { display: flex; align-items: center; gap: 12px; }
#grow { width: 24px !important; height: 24px !important; }
#grow svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
/* Expanded, the drawer is the desktop: inside the same gap the windows keep,
   framed all round and rounded, with no tab to put it away — the expand
   button, Escape, or a window coming back make it a drawer again. */
body[data-mode="expanded"] #panel { inset: var(--in-top, 10px) var(--in-right, 10px) var(--in-bottom, 10px) var(--in-left, 10px) !important; border: 1px solid var(--frame) !important; border-radius: 12px !important; }
body[data-mode="expanded"] #tuck { display: none !important; }
/* With click-outside on, a click off the drawer puts it away: no tab for it. */
body[data-dismiss] #tuck { display: none !important; }
body[data-mode="expanded"][data-outline="none"] #panel { border-color: transparent !important; }
/* Which drawer is which, at a glance: its own mark, and a writing surface on
   a paper-toned panel. Which one has you: an accent frame and a lit title;
   the other dims a little. */
.mark { width: 14px; height: 14px; stroke: var(--accent); stroke-width: 1.4; fill: none; margin-right: 8px; vertical-align: -2px; }
body[data-drawer="writing"] #panel { background: color-mix(in srgb, var(--paper) var(--alpha, 100%), transparent); }
body[data-mode="pulled"][data-focus] #panel { border-color: var(--accent); }
body[data-mode="pulled"]:not([data-focus]) header { opacity: .62; }
body[data-mode="filed"] #handle { display: flex; }
body[data-mode="filed"] #panel { display: none; }

/* The way back is where the way in was: a tab at the middle of the screen-side
   edge, the handle's size and place, so the hand that opened the drawer finds
   what closes it without looking for a corner. */
#tuck { position: absolute; z-index: 5; display: flex; align-items: center; justify-content: center; background: var(--desk); border: 1px solid var(--frame); color: var(--muted); cursor: pointer; transition: color .12s, border-color .12s; }
#tuck:hover { color: var(--accent); border-color: var(--accent); }
#tuck .grip { width: 2px; height: 22px; background: currentColor; border-radius: 1px; }
body[data-edge="left"] #tuck { left: 0; top: calc(50% - 28px); width: 10px; height: 56px; border-left: 0; border-radius: 0 9px 9px 0; }
body[data-edge="right"] #tuck { right: 0; top: calc(50% - 28px); width: 10px; height: 56px; border-right: 0; border-radius: 9px 0 0 9px; }
body[data-edge="top"] #tuck { top: 0; left: calc(50% - 28px); width: 56px; height: 10px; border-top: 0; border-radius: 0 0 9px 9px; }
body[data-edge="bottom"] #tuck { bottom: 0; left: calc(50% - 28px); width: 56px; height: 10px; border-bottom: 0; border-radius: 9px 9px 0 0; }
body[data-edge="top"] #tuck .grip, body[data-edge="bottom"] #tuck .grip { width: 22px; height: 2px; }
/* How a drawer looks (Settings, Appearance): its outline in the accent while in
   use, a plain line, or none; a shadow, which needs room on the side away from
   the screen edge to fall into; and its opacity (--alpha, above). */
body[data-outline="line"] #panel { border-color: var(--frame) !important; }
body[data-outline="none"] #panel, body[data-outline="none"] #tuck { border-color: transparent !important; }
/* Solid paper in a see-through frame: the writing page keeps its own fill. */
body[data-solid-paper][data-drawer="writing"] .editor { background: var(--paper); }
body[data-shadow] #panel { box-shadow: 0 6px 22px rgba(0, 0, 0, .6), 0 0 4px rgba(0, 0, 0, .45); }
body[data-shadow][data-edge="left"] #panel { right: 18px; }
body[data-shadow][data-edge="right"] #panel { left: 18px; }
body[data-shadow][data-edge="top"] #panel { bottom: 18px; }
body[data-shadow][data-edge="bottom"] #panel { top: 18px; }
/* Shorter than the screen: room at an end that stops short, for the shadow. */
body[data-room-top] #panel { top: 18px; }
body[data-room-bottom] #panel { bottom: 18px; }
.xh { display: none; }
#panel { position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); border: 1px solid var(--frame); padding: 14px 16px; display: flex; flex-direction: column; }
/* Flush with the edge it comes from, so that side has no line. */
body[data-edge="left"] #panel { border-left: 0; border-radius: 0 12px 12px 0; }
body[data-edge="right"] #panel { border-right: 0; border-radius: 12px 0 0 12px; }
body[data-edge="top"] #panel { border-top: 0; border-radius: 0 0 12px 12px; }
body[data-edge="bottom"] #panel { border-bottom: 0; border-radius: 12px 12px 0 0; }
header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
main { flex: 1; min-height: 0; display: flex; gap: 12px; }
.tree { overflow: auto; min-width: 180px; }
.row { padding: 4px 8px; margin: 2px 0; border-radius: var(--radius-row); display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
.row:hover { background: var(--accent-wash); }
.row.on { background: var(--accent-wash); border-left: 2px solid var(--accent); border-radius: 0 var(--radius-row) var(--radius-row) 0; }
.row .tw { width: 12px; color: var(--muted); display: inline-block; }
.kids { margin-left: 14px; }
.kids.shut { display: none; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.modes { display: flex; gap: 2px; align-self: flex-end; border: 1px solid var(--line); border-radius: 14px; padding: 2px; }
.modes button { border: 0; border-radius: var(--radius-pill); padding: 1px 10px; font-size: 11px; letter-spacing: 2px; color: var(--muted); }
.modes button.on { background: var(--accent-wash); color: var(--accent); }
.editor { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-control); padding: 10px 12px; user-select: text; -webkit-user-select: text; }
.editor[data-mode="live"], .editor[data-mode="raw"] { padding: 0; overflow: hidden; display: flex; }
.editor .cm-editor { flex: 1; min-width: 0; }
.editor h1, .editor h2, .editor h3 { font-weight: 500; letter-spacing: 1px; margin: 10px 0 4px; }
/* The writing page's type, at Settings' writing size (--type-scale). */
.editor { font-size: calc(14px * var(--type-scale, 1)); }
.editor h1 { font-size: 1.43em; } .editor h2 { font-size: 1.21em; } .editor h3 { font-size: 1.07em; }
.editor a { color: var(--accent); }
.editor code { font-family: ui-monospace, monospace; font-size: .9em; background: var(--accent-wash); border-radius: 4px; padding: 0 4px; }
.editor pre { background: var(--desk); border-radius: 6px; padding: 8px 10px; overflow: auto; }
.editor pre code { background: none; padding: 0; }
.editor table { border-collapse: collapse; } .editor td, .editor th { border: 1px solid var(--line); padding: 3px 8px; }

li.task { list-style: none; margin-left: -1.2em; display: flex; gap: 7px; align-items: baseline; }
/* Preview's boxes look like the editor's: drawn, never the engine's white square. */
li.task input { margin: 0; flex: none; appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 4px; background: transparent; cursor: pointer; display: inline-grid; place-content: center; vertical-align: -2px; }
li.task input:hover { border-color: var(--accent); }
li.task input:checked { background: var(--accent); border-color: var(--accent); }
li.task input:checked::after { content: ""; width: 6px; height: 3px; border: solid var(--surface); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
li.task.is-done > span { text-decoration: line-through; color: var(--muted); }

.canvas-tree { min-width: 150px; max-width: 200px; }
.tree.hidden { display: none; }
.canvas-pane { flex: 1; min-width: 0; display: flex; border: 1px solid var(--line); border-radius: var(--radius-control); overflow: hidden; background: transparent; }
/* No fill of its own: the canvas's paper covers it, and a second see-through
   layer here would make a see-through drawer nearly solid again. */
.canvas-frame { flex: 1; border: 0; background: transparent; }
.crumb { cursor: pointer; }
.crumb:hover { color: var(--accent); }
.pane-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.section { margin: 12px 8px 4px; }
.calendar { padding: 0 4px 6px; border-bottom: 1px solid var(--line); }
.cal-bar, .cal-month { display: flex; justify-content: space-between; align-items: center; margin: 2px 4px 6px; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { padding: 0 8px; font-size: 11px; letter-spacing: 1px; }
button.flat { border: 0; padding: 0 6px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-head { text-align: center; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.cal-day { border: 1px solid transparent; border-radius: var(--radius-row); padding: 2px 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; min-height: 30px; color: var(--muted); }
.cal-day small { font-size: 9px; letter-spacing: .5px; color: var(--accent); min-height: 10px; }
.cal-day.has { color: var(--text); }
.cal-day.today { border-color: var(--line); }
.cal-day.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); }
.cal-day:hover { border-color: var(--accent); }
button.danger:hover { color: var(--danger); border-color: var(--danger); }
.confirm { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); display: flex; align-items: center; justify-content: center; border-radius: inherit; }
.confirm .box { background: var(--surface); border: 1px solid var(--frame); border-radius: var(--radius-control); box-shadow: var(--menu-shadow); padding: 16px 18px; min-width: 260px; max-width: 70%; }
.confirm .title { letter-spacing: 1px; margin-bottom: 4px; }
.confirm p { margin: 4px 0; color: var(--muted); }
.confirm .said { color: var(--danger); }
.confirm .buttons { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
.confirm .buttons .danger { border-color: var(--danger); color: var(--danger); }
.context { position: fixed; z-index: 50; min-width: 150px; }
footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.empty { color: var(--muted); padding: 8px; }
</style>
</head>
<body data-mode="filed" data-edge="left">
<div id="handle" title=""><div class="grip"></div></div>
<div id="panel">
  <!-- The corners a drawn-in or connecting panel draws its edges between;
       sliding has no use for them, so they show only with those motions. -->
  <span class="xh" style="left:4px;top:4px"></span><span class="xh" style="right:4px;top:4px"></span>
  <span class="xh" style="left:4px;bottom:4px"></span><span class="xh" style="right:4px;bottom:4px"></span>
  <div id="tuck" title="Put it away (Esc)" role="button" aria-label="Close"><div class="grip"></div></div>
  <header>
    <span class="title"><svg class="mark" id="mark" viewBox="0 0 14 14"></svg><span id="where"></span></span>
    <span class="ends"><span class="label" id="count"></span><button class="icon-btn" id="grow" title="Make this the desktop"></button></span>
  </header>
  <main id="body"></main>
  <footer>
    <span id="actions"></span>
    <span class="label" id="status"></span>
  </footer>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="motion.js"></script>
<script src="drawer.js"></script>
</body>
</html>

One drawer: a handle when filed, a panel when out or pulled. The same page in
every mode — the surface around it is what moves between layers, and the page
keeps its state across that.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talaris drawer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500&family=Rajdhani:wght@400;500&family=Saira+Semi+Condensed:wght@400;500&family=Exo+2:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
#handle { display: none; position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--frame); align-items: center; justify-content: center; color: var(--muted); }
body[data-edge="left"] #handle { border-left: 0; border-radius: 0 9px 9px 0; }
body[data-edge="right"] #handle { border-right: 0; border-radius: 9px 0 0 9px; }
body[data-edge="top"] #handle { border-top: 0; border-radius: 0 0 9px 9px; }
body[data-edge="bottom"] #handle { border-bottom: 0; border-radius: 9px 9px 0 0; }
#handle:hover { color: var(--accent); border-color: var(--accent); cursor: pointer; }
#handle .grip { width: 2px; height: 34px; background: currentColor; border-radius: 1px; }
body[data-edge="top"] #handle .grip, body[data-edge="bottom"] #handle .grip { width: 34px; height: 2px; }
body[data-mode="filed"] #handle { display: flex; }
body[data-mode="filed"] #panel { display: none; }

#panel { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--frame); padding: 14px 16px; display: flex; flex-direction: column; }
/* Flush with the edge it comes from, so that side has no line. */
body[data-edge="left"] #panel { border-left: 0; border-radius: 0 12px 12px 0; }
body[data-edge="right"] #panel { border-right: 0; border-radius: 12px 0 0 12px; }
body[data-edge="top"] #panel { border-top: 0; border-radius: 0 0 12px 12px; }
body[data-edge="bottom"] #panel { border-bottom: 0; border-radius: 12px 12px 0 0; }
header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
main { flex: 1; min-height: 0; display: flex; gap: 12px; }
.tree { overflow: auto; min-width: 180px; }
.row { padding: 4px 8px; margin: 2px 0; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
.row:hover { background: var(--accent-wash); }
.row.on { background: var(--accent-wash); border-left: 2px solid var(--accent); border-radius: 0 6px 6px 0; }
.row .tw { width: 12px; color: var(--muted); display: inline-block; }
.kids { margin-left: 14px; }
.kids.shut { display: none; }
textarea { flex: 1; resize: none; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; line-height: 1.6; }
textarea:focus { border-color: var(--accent); }
footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.empty { color: var(--muted); padding: 8px; }
</style>
</head>
<body data-mode="filed" data-edge="left">
<div id="handle" title=""><div class="grip"></div></div>
<div id="panel">
  <span class="xh" style="left:-6px;top:-6px"></span><span class="xh" style="right:-6px;top:-6px"></span>
  <span class="xh" style="left:-6px;bottom:-6px"></span><span class="xh" style="right:-6px;bottom:-6px"></span>
  <header>
    <span class="title" id="where"></span>
    <span class="label" id="count"></span>
  </header>
  <main id="body"></main>
  <footer>
    <span id="actions"></span>
    <span class="label" id="status"></span>
  </footer>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="drawer.js"></script>
</body>
</html>

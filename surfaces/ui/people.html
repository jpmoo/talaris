The People panel (people_panel.py, DESIGN *People*): everyone down the left,
by organization or A to Z, the one chosen on the right — their fields as the
person type has them, the contact cards they are tied to, and what they are
connected to. Up over a dimmed screen from the bar's People button; a window
by its grow button.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris people</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<style>
/* As Tasks': a panel over the dimmed screen; a window, the whole surface. */
html { background: var(--catch); overflow: hidden; height: 100%; }
/* The dim is a button: a press there closes it — the bar's button under it included. */
html:not([data-window]) { cursor: pointer; }
body { cursor: default; position: relative; }
body {
  width: min(1040px, calc(100% - 32px)); height: 82vh; margin: 9vh auto 0; display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); color: var(--text); border: 1px solid var(--frame); border-radius: var(--radius-panel);
  box-shadow: var(--menu-shadow); overflow: hidden;
}
/* A window: the whole of it, no dim, no frame of its own — Hyprland draws one. */
html[data-window] { background: var(--surface); }
html[data-window] body { width: 100%; height: 100%; margin: 0; box-shadow: none; border: 0; border-radius: 0; }

/* Wrapping onto a second line rather than running off the panel's side. */
header { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
header .tools { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
header .corner { flex: none; display: flex; align-items: center; min-height: 28px; }
/* The actions keep to the right, on whichever line they land. */
#list-actions { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
header h1 { font-size: 15px; font-weight: 500; margin: 0 2px 0 4px; letter-spacing: .3px; flex: none; white-space: nowrap; }
header .t-btn { white-space: nowrap; flex: none; }
header .spacer { flex: 1; }
header .icon-btn[hidden], header .t-btn[hidden] { display: none !important; }
header .seg { flex: none; }
#count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
#msg { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 40%; }
#msg.err { color: var(--danger); }
#q { width: 200px; flex: 0 1 200px; min-width: 90px; font-size: 12.5px; }

main { flex: 1; min-height: 0; display: flex; position: relative; }

/* The left: everyone, in groups or by letter. */
#list { width: 300px; flex: none; border-right: 1px solid var(--line); overflow: auto; outline: none; padding-bottom: 8px; }
.ghead { display: flex; align-items: center; gap: 6px; padding: 10px 14px 4px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.ghead.on .name { color: var(--accent); }
.ghead .name:hover { color: var(--accent); }
.ghead:hover { color: var(--text); }
/* One of my organizations: said on its heading. */
.ghead .own-mark { color: var(--accent); letter-spacing: 1px; }
.ghead .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ghead .n { letter-spacing: 0; flex: none; }
.letter { padding: 10px 14px 2px; font-size: 10px; letter-spacing: 2px; color: var(--muted); }
.prow { display: flex; align-items: center; gap: 10px; padding: 6px 14px; cursor: pointer; }
.prow:hover { background: var(--accent-hover); }
.prow.on { background: var(--accent-wash); }
#list:focus .prow.on { box-shadow: inset 2px 0 0 var(--accent); }
.p-main { flex: 1; min-width: 0; }
.p-name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow.on .p-name { color: var(--accent); }
.p-sub { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tie { width: 7px; height: 7px; border-radius: 50%; flex: none; box-sizing: border-box; }
.tie.tied { background: var(--accent); opacity: .8; }
.tie.untied { border: 1.5px solid var(--muted); opacity: .7; }

/* The right: the one chosen. */
#person { flex: 1; min-width: 0; overflow: auto; padding: 14px 18px 24px; font-size: 12.5px; }
/* Contact cards: the ones tied, then likely ones. */
.hint { color: var(--muted); font-size: 11.5px; }
.hint.err { color: var(--danger); }
.card { border: 1px solid var(--line); border-radius: var(--radius-control); background: var(--paper); padding: 8px 10px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; }
.card .c-main { flex: 1; min-width: 0; }
.card .c-name { font-size: 13px; }
.card .c-line { color: var(--muted); overflow-wrap: anywhere; }
.card .c-also { color: var(--text); margin-top: 6px; }
.card.gone { opacity: .75; }
/* Review: two that may be one, side by side, and the one answer. */
.r-item { border-bottom: 1px solid var(--line); padding: 10px 0; }
.r-item .r-why { margin-bottom: 6px; }
.r-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.r-two .card { margin: 0; }
.r-item > .c-acts { margin-top: 8px; }
#review.on { background: var(--accent-wash); color: var(--accent); }
#twice { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--accent-wash); border-bottom: 1px solid var(--line); flex: none; }
#twice[hidden] { display: none; }
#twice .t-text { flex: 1; min-width: 0; }
#twice .t-btn { flex: none; }
.card .c-acts { display: flex; gap: 6px; flex: none; }
.card.likely { padding: 6px 10px; align-items: center; }
.sub-h { font-size: 11.5px; color: var(--muted); margin: 12px 0 6px; }
.nocontact { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); cursor: pointer; width: fit-content; }
#card-q { width: 260px; font-size: 12.5px; margin-top: 4px; }

.p-foot { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.p-foot .spacer { flex: 1; }

.org-person { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.org-person .linkish { background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; font: inherit; text-align: left; }
.org-person .linkish:hover { text-decoration: underline; }
.org-person .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 4px; visibility: hidden; }
.org-person:hover .x { visibility: visible; }
.org-person .x:hover { color: var(--danger, var(--text)); }
.part > .t-btn.small { margin-top: 8px; }

@media (max-width: 760px) { #list { width: 220px; } header .seg { display: none; } }
</style>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="thingcard.css">
</head>
<body data-arrives>
<header>
  <div class="tools">
  <h1>People</h1>
  <span id="count"></span>
  <input type="search" id="q" placeholder="Find" spellcheck="false">
  <span class="seg" id="mode" title="By organization, A–Z, or the organizations themselves"></span>
  <span class="seg" id="named" title="Known by a name, or only by an address"></span>
  <span class="seg" id="orgd" title="With an organization, or with none"></span>
  <span id="msg"></span>
  <span class="spacer"></span>
  <span id="list-actions"></span>
  <button class="t-btn" id="review" title="Everyone, looked through for one person entered twice">Review</button>
  <button class="t-btn" id="add">+ Person</button>
  </div>
  <!-- Expand (a panel) or close (a window): the top right corner, however the rest wraps. -->
  <span class="corner"><button class="icon-btn" id="grow"></button><button class="icon-btn" id="close"></button></span>
</header>
<!-- People who may be entered twice: said, and what it costs, until they are reviewed (people.js, warnTwice). -->
<div id="twice" hidden></div>
<main>
  <aside id="list" tabindex="0"></aside>
  <section id="person"></section>
</main>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="pagetips.js"></script>
<script src="icons.js"></script>
<script src="palette.js"></script>
<script src="surface.js"></script>
<script src="kit.js"></script>
<script src="attach.js"></script>
<script src="motion.js"></script>
<script src="peek.js"></script>
<script src="mentions.js"></script>
<script src="thingcard.js"></script>
<script src="people.js"></script>
</body>
</html>

The calendar (calendar_panel.py): the accounts' events by month, week or day,
made, changed and removed here and kept in step with each account by
Evolution Data Server (calendard.py). Up over a dimmed screen from the bar's
date and time; full screen by its expand button.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris calendar</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="motion.css">
<style>
/* As Morgan's: a panel over the dimmed screen; full screen, the whole surface. */
html { background: var(--catch); overflow: hidden; height: 100%; }
/* The dim is a button: a press there closes it — the bar's button under it included. */
html:not([data-window]) { cursor: pointer; }
body { cursor: default; }
body {
  /* Centered both ways on the screen. */
  width: min(1040px, calc(100% - 32px)); height: 82vh; margin: 9vh auto 0; display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); color: var(--text); border: 1px solid var(--frame); border-radius: var(--radius-panel);
  box-shadow: var(--menu-shadow); overflow: hidden;
}
/* A window: the whole of it, no dim, no frame of its own — Hyprland draws one. */
html[data-window] { background: var(--surface); }
html[data-window] body { width: 100%; height: 100%; margin: 0; box-shadow: none; border: 0; border-radius: 0; }

header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
header h1 { font-size: 15px; font-weight: 500; margin: 0 8px 0 4px; letter-spacing: .3px; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Narrow (a window half the screen): the buttons keep one line each; the title gives way. */
header .t-btn, header .seg button { white-space: nowrap; flex: none; }
header .seg { flex: none; }
#msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
body.no-side #side { display: none; }

header .spacer { flex: 1; }
#search { width: 180px; flex: 0 1 180px; min-width: 80px; font-size: 12.5px; }
/* What a search found (calendar.js, drawFound): events coming up, then past, then tasks. */
.found { flex: 1; overflow: auto; padding: 6px 18px 18px; }
.found h3 { font-size: 10px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.found .hit { display: grid; grid-template-columns: 10px 170px 1fr; align-items: baseline; gap: 10px; padding: 6px 8px; border-radius: var(--radius-row); cursor: pointer; }
.found .hit:hover { background: var(--accent-hover); }
.found .hit .sw { background: var(--c); align-self: center; }
.found .hit .when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.found .hit .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.found .hit .what small { color: var(--muted); margin-left: 8px; }
.found .hit.done .what { text-decoration: line-through; opacity: var(--done); }
/* The header's icon buttons are the shared ones (controls.css .icon-btn). */
header .icon-btn[hidden] { display: none !important; }
header .icon-btn:hover { color: var(--accent) !important; border-color: var(--accent) !important; }
header .icon-btn.on { color: var(--accent) !important; }
.seg { display: inline-flex; }

main { flex: 1; min-height: 0; display: flex; }
#side { width: 210px; flex: none; border-right: 1px solid var(--line); padding: 12px; overflow: auto; font-size: 12.5px; }
#side h3 { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-weight: 400; }
#side h3:first-child { margin-top: 0; }
.cal { display: flex; align-items: center; gap: 8px; padding: 3px 4px; }
.cal .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1.5px solid var(--c); padding: 0; background: transparent; cursor: pointer; }
.cal .sw:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent); }
.cal.muted span:last-child { color: var(--muted); }
.cal.on .sw { background: var(--c); }
.cal span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.note { line-height: 1.6; }
.note code { user-select: all; background: var(--desk); padding: 2px 6px; border-radius: var(--radius-row); font-size: 12px; }

/* Month */
.month { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); min-height: 0; }
.dow { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 4px 2px; min-height: 0; overflow: hidden; cursor: default; display: flex; flex-direction: column; gap: 2px; }
.cell:nth-child(7n+7) { border-right: 0; }
.cell .n { font-size: 12px; color: var(--muted); padding: 1px 4px; align-self: flex-start; border-radius: var(--radius-pill); cursor: pointer; }
.cell.other .n { opacity: .45; }
.cell.today .n { background: var(--accent); color: var(--surface); }
/* An event in a day: its calendar's color, a colored edge. */
.ev-chip { font-size: 11.5px; padding: 1px 6px; border-radius: var(--radius-row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
        background: color-mix(in srgb, var(--c) 22%, transparent); border-left: 3px solid var(--c); }
.ev-chip.timed { background: none; }
.ev-chip:hover { background: color-mix(in srgb, var(--c) 34%, transparent); }
.more { font-size: 11px; color: var(--muted); padding: 0 6px; cursor: pointer; }

/* Week and day */
.days { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.dayhead { display: grid; grid-template-columns: 52px repeat(var(--cols), 1fr); border-bottom: 1px solid var(--line); flex: none; }
.dayhead div { padding: 6px 8px; font-size: 12px; color: var(--muted); }
.dayhead .today { color: var(--accent); }
/* Tasks, above the day's events (calendar.js, taskRow): a bar from available to due. */
.taskrow { display: grid; grid-template-columns: 52px repeat(var(--cols), 1fr); row-gap: 3px; padding: 4px 0; border-bottom: 1px solid var(--line); flex: none; max-height: 30vh; overflow-y: auto; }
.taskrow .lbl { grid-column: 1; font-size: 10px; color: var(--muted); padding: 2px 6px; }
.tbar { margin: 0 3px; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 8px 0 3px; border-radius: var(--radius-pill); font-size: 11.5px; cursor: grab; touch-action: none; user-select: none;
  background: var(--accent-wash); border: 1px solid var(--accent-line); }
.tbar:hover { background: var(--accent-strong); }
.tbar .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbar .tick { flex: none; width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; color: transparent; font-size: 10px; line-height: 1; cursor: pointer; }
.tbar .tick:hover { border-color: var(--accent); color: var(--accent); }
.tbar .tick.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.tbar.done { opacity: var(--done); }
.tbar.done .tt { text-decoration: line-through; }
.tbar.late { background: var(--danger-wash); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
/* Begun before the days on show, or going on after them: open at that end. */
.tbar.from-before { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; border-left-style: dashed; }
.tbar.goes-on { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; border-right-style: dashed; }
.tbar.dragging { cursor: grabbing; z-index: 2; box-shadow: var(--menu-shadow); }
.allday { display: grid; grid-template-columns: 52px repeat(var(--cols), 1fr); border-bottom: 1px solid var(--line); flex: none; min-height: 22px; }
.allday > div { padding: 2px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); }
.allday > div:first-child { border-left: 0; font-size: 10px; color: var(--muted); padding: 4px 6px; }
.grid { flex: 1; overflow: auto; position: relative; }
.hours { display: grid; grid-template-columns: 52px repeat(var(--cols), 1fr); position: relative; }
.hour { height: 48px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); font-size: 10px; color: var(--muted); padding: 0 6px; text-align: right; }
.col { position: relative; border-left: 1px solid var(--line); }
.col .slot { height: 48px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.ev { position: absolute; left: 2px; right: 2px; border-radius: var(--radius-row); padding: 2px 6px; font-size: 11.5px; overflow: hidden; cursor: pointer;
      background: color-mix(in srgb, var(--c) 30%, var(--surface)); border-left: 3px solid var(--c); line-height: 1.3; }
.ev small { display: block; color: var(--muted); }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 2; pointer-events: none; }

/* The editor */
#editor { position: absolute; inset: 0; display: none; place-items: center; background: var(--scrim); z-index: var(--z-sheet); }
#editor.open { display: grid; }
#editor .box { width: min(460px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--frame); border-radius: var(--radius-panel); box-shadow: var(--menu-shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
#editor .row { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
#editor .row > span:first-child { width: 74px; color: var(--muted); flex: none; }
#editor input[type=text], #editor textarea { flex: 1; }
#editor .box { position: relative; max-height: calc(100% - 24px); overflow: auto; }
/* Rows that are not wanted are gone: the row's own display would otherwise show them. */
#editor .row[hidden], #editor .pick[hidden], #editor input[hidden] { display: none; }
.seg.off { opacity: var(--disabled); pointer-events: none; }
.note-row small, #e-org { color: var(--muted); font-size: 11.5px; }
.who { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-row); background: var(--desk); padding: 3px 6px; }
.who input { flex: 1; min-width: 120px; border: 0 !important; background: none !important; padding: 2px !important; }
.chip .st { color: var(--muted); margin-left: 4px; }
#e-chips { display: contents; }
/* Still to come and waiting on my answer: a dashed edge, until I say. (Past
   ones are not marked: an invitation never answered, Google keeps as such.) */
.ev-chip.waiting, .ev.waiting { border-left-style: dashed; }
.ev-chip.declined, .ev.declined { opacity: .5; text-decoration: line-through; }
/* The pickers (controls.css .pick): as wide as the row lets them. */
#editor .pick { flex: 1; font-size: 12.5px; }
#editor input.time-in { flex: 0 0 96px; text-align: center; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
#editor textarea { min-height: 70px; resize: vertical; }
#editor .acts { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 4px; }
#editor .acts .spacer { flex: 1; }
#msg { font-size: 12px; color: var(--muted); }
#msg.err { color: var(--danger); }
body { position: relative; }
</style>
<link rel="stylesheet" href="kit.css">
</head>
<body data-arrives>
<header>
  <button class="icon-btn" id="side-toggle" title="Hide the list of calendars"></button>
  <button class="t-btn" id="today">Today</button>
  <button class="icon-btn" id="prev" title="Before"></button>
  <button class="icon-btn" id="next" title="After"></button>
  <h1 id="title"></h1>
  <span id="msg"></span>
  <span class="spacer"></span>
  <input type="search" id="search" placeholder="Find events and tasks" spellcheck="false" title="Find events a year either side, and tasks (Ctrl+F)">
  <span class="seg" id="mode"></span>
  <button class="t-btn" id="new">New event</button>
  <button class="icon-btn" id="grow" title="Full screen"></button>
  <button class="icon-btn" id="close" title="Close"></button>
</header>
<main>
  <aside id="side"></aside>
  <section id="view"></section>
</main>
<div id="editor"><div class="box">
  <div class="row"><span>Title</span><input type="text" class="field" id="e-title"></div>
  <div class="row"><span>Calendar</span><button class="pick" id="e-cal"></button></div>
  <div class="row"><span>All day</span><button class="switch" id="e-allday"></button></div>
  <div class="row"><span>Starts</span><button class="pick" id="e-sd"></button><input type="text" class="time-in" id="e-st" spellcheck="false"></div>
  <div class="row"><span>Ends</span><button class="pick" id="e-ed"></button><input type="text" class="time-in" id="e-et" spellcheck="false"></div>
  <div class="row"><span>Where</span><input type="text" class="field" id="e-where"></div>
  <div class="row"><span>Notes</span><textarea class="field" id="e-notes"></textarea></div>
  <div class="row"><span>Repeats</span><span class="seg" id="e-freq"></span></div>
  <div class="row" id="e-days-row"><span></span><span class="seg" id="e-days"></span></div>
  <div class="row" id="e-ends-row"><span>Ends</span><span class="seg" id="e-ends"></span><button class="pick" id="e-until"></button><input type="text" class="time-in" id="e-count" spellcheck="false"></div>
  <div class="row" id="e-who-row"><span>Invite</span><div class="who"><span id="e-chips"></span><input type="text" id="e-who" placeholder="Name or address" spellcheck="false"></div></div>
  <div class="row note-row" id="e-who-note"><span></span><small id="e-who-why"></small></div>
  <div class="row" id="e-answer-row"><span>Going?</span><span class="seg" id="e-answer"></span><small id="e-org"></small></div>
  <div class="row" id="e-which-row"><span>Change</span><span class="seg" id="e-which"></span></div>
  <div class="acts"><button class="t-btn danger" id="e-delete">Delete</button><span class="spacer"></span><button class="t-btn" id="e-cancel">Cancel</button><button class="t-btn primary" id="e-save">Save</button></div>
</div></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="pagetips.js"></script>
<script src="surface.js"></script>
<script src="kit.js"></script>
<script src="motion.js"></script>
<script src="icons.js"></script>
<script src="calendar.js"></script>
</body>
</html>

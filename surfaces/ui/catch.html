The catcher (sensor.py): over the windows and under a pulled drawer — clear,
or dimming them, as Settings says. A press on it is a press off the drawer,
which puts the drawer away.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
html, body { margin: 0; height: 100%; background: var(--catch); }
/* Darkened and lightened by the same fade, either way (dim.py waits it out before the layer goes). */
body { transition: background-color .25s ease-out; }
body.dim { background: var(--scrim); }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
"use strict";
// Dimmed or clear, faded either way from where it is.
window.dim = (on) => { document.body.classList.toggle("dim", !!on); };
new QWebChannel(qt.webChannelTransport, (channel) => {
  const bridge = channel.objects.bridge;
  for (const type of ["pointerdown", "mousedown", "touchstart"]) document.addEventListener(type, () => bridge.touched(), true);
});
</script>
</body>
</html>

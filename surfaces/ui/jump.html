Project jump (jump_panel.py): the projects starting with the letter of
Super+Alt+letter, when there is more than one. Arrows and Enter, a click, or
more letters typed to narrow it; Backspace widens it again.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris projects</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<style>
html { background: rgba(0, 0, 0, .32); overflow: hidden; height: 100%; cursor: pointer; }
body {
  cursor: default; position: relative; width: min(360px, calc(100% - 32px)); height: auto; max-height: 70vh; overflow: auto; margin: 22vh auto 0;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); color: var(--text); border: 1px solid var(--frame); border-radius: 12px;
  box-shadow: var(--menu-shadow); padding: 10px; font-size: 13px;
}
#typed { display: flex; align-items: baseline; gap: 8px; padding: 2px 8px 8px; color: var(--muted); font-size: 12px; }
#typed b { color: var(--text); font-weight: 500; font-size: 15px; letter-spacing: .5px; }
#list { display: flex; flex-direction: column; gap: 1px; }
.p { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; border: 0 !important; background: none !important; padding: 7px 10px !important;
  border-radius: var(--radius-row) !important; color: var(--text) !important; cursor: pointer; font: inherit; }
.p .code { color: var(--muted); font-size: 11px; letter-spacing: 1px; margin-left: auto; }
.p.cur .name::after { content: " · here"; color: var(--muted); font-size: 11.5px; }
.p.on, .p:hover { background: var(--accent-wash) !important; color: var(--accent) !important; }
.none { color: var(--muted); padding: 8px 10px; }
</style>
</head>
<body>
<div id="typed"></div>
<div id="list"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="surface.js"></script>
<script src="motion.js"></script>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  let bridge = null, surface = { up: false };
  let typed = "", at = 0, shown = [];

  function draw() {
    const all = surface.projects || [];
    shown = all.filter((p) => p.name.toLowerCase().startsWith(typed));
    at = Math.max(0, Math.min(at, shown.length - 1));
    $("typed").replaceChildren(document.createTextNode("Projects starting"), Object.assign(document.createElement("b"), { textContent: typed.toUpperCase() }));
    $("list").replaceChildren(...(shown.length ? shown.map((p, i) => {
      const b = document.createElement("button");
      b.className = "p" + (i === at ? " on" : "") + (p.current ? " cur" : "");
      b.append(Object.assign(document.createElement("span"), { className: "name", textContent: p.name }),
        Object.assign(document.createElement("span"), { className: "code", textContent: p.code || "" }));
      b.addEventListener("click", () => go(p));
      b.addEventListener("pointermove", () => { if (at !== i) { at = i; draw(); } });
      return b;
    }) : [Object.assign(document.createElement("div"), { className: "none", textContent: "No project starts with that" })]));
    const on = $("list").querySelector(".on");
    if (on) on.scrollIntoView({ block: "nearest" });
  }
  function go(p) { if (p && bridge) bridge.choose(p.id); }

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (k === "Escape") { e.preventDefault(); if (bridge) bridge.file(); }
    else if (k === "ArrowDown" || (k === "Tab" && !e.shiftKey)) { e.preventDefault(); at = (at + 1) % Math.max(1, shown.length); draw(); }
    else if (k === "ArrowUp" || (k === "Tab" && e.shiftKey)) { e.preventDefault(); at = (at - 1 + shown.length) % Math.max(1, shown.length); draw(); }
    else if (k === "Enter") { e.preventDefault(); go(shown[at]); }
    else if (k === "Backspace") { e.preventDefault(); if (typed.length > 1) { typed = typed.slice(0, -1); at = 0; draw(); } }
    else if (k.length === 1 && !e.altKey) {
      e.preventDefault();
      typed += k.toLowerCase();
      at = 0;
      draw();
      // Narrowed to one: that one.
      if (shown.length === 1) go(shown[0]);
    }
  });
  document.addEventListener("pointerdown", (e) => { if (e.target === document.documentElement && bridge && surface.up) bridge.file(); });
  window.pressedAt = (x, y) => { if (bridge && surface.up && document.elementFromPoint(x, y) === document.documentElement) bridge.file(); };
  for (const t of ["pointerdown", "keydown"]) addEventListener(t, () => bridge && bridge.activity(), { capture: true, passive: true });

  function how() {
    const m = surface.motion || {};
    return { kind: m.motion, speed: m.speed, edge: "top", flush: false, backdrop: document.documentElement, viewport: surface.viewport,
      shown: () => bridge && bridge.drawn() };
  }
  function onState(s) {
    const was = surface;
    surface = s;
    // A new letter (Super+Alt+another, the list already out) starts over from it.
    if (s.up && (!was.up || s.letter !== was.letter)) { typed = s.letter || ""; at = 0; }
    if (s.up && !was.up) Motion.arrive(document.body, how());
    if (s.up) {
      draw();
      // None at all: said, then away.
      if (!shown.length) setTimeout(() => { if (surface.up && !shown.length && bridge) bridge.file(); }, 1200);
    }
  }
  Surface.connect({ onState }).then((b) => {
    bridge = b;
    b.leave.connect(() => {
      surface = { ...surface, up: false };
      const going = Motion.leave(document.body, how());
      if (going) going.onfinish = () => bridge.left(); else bridge.left();
    });
  });
})();
</script>
</body>
</html>

The project carousel (jump_panel.py): every project in a ring, most recent
first, turned to the one before this. Left and Right (or Tab, or Super+Tab
again) turn it; letters narrow it to the names holding them; Enter or a click
on the one in front goes there; Escape puts it away.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris projects</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="controls.css">
<link rel="stylesheet" href="motion.css">
<style>
html { background: rgba(0, 0, 0, .32); overflow: hidden; height: 100%; cursor: pointer; }
body { margin: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
#panel {
  cursor: default; position: relative; width: min(1100px, calc(100% - 32px)); height: 340px; overflow: hidden;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); color: var(--text);
  border: 1px solid var(--frame); border-radius: 14px; box-shadow: var(--menu-shadow); font-size: 13px;
}
#typed { position: absolute; top: 14px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
#typed b { color: var(--accent); font-weight: 500; font-size: 13px; letter-spacing: 1px; text-transform: none; margin-left: 6px; }
#ring { position: absolute; inset: 40px 0 0; }
.card {
  position: absolute; left: 50%; top: 18px; width: 300px; margin-left: -150px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .22s; cursor: pointer; will-change: transform;
}
.card img { width: 300px; height: 188px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--desk); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.card .name { font-size: 15px; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
.card .code { color: var(--muted); font-size: 10.5px; letter-spacing: 1.5px; margin-top: -6px; }
.card.front img { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash), 0 10px 28px rgba(0, 0, 0, .35); }
.card.front .name { color: var(--accent); }
.card:not(.front) .code { visibility: hidden; }
.card.here .name::after { content: " · here"; color: var(--muted); font-size: 11.5px; }
.none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>
<body>
<div id="panel">
  <div id="typed"></div>
  <div id="ring"></div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="surface.js"></script>
<script src="motion.js"></script>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  let bridge = null, surface = { up: false };
  let typed = "", at = 0, shown = [], stamp = 0;
  const cards = new Map();  // project id → its card, kept so turning slides them rather than redrawing
  // Two each side of the one in front: where each sits, how big, how clear.
  const SLOTS = { 0: [0, 1, 1], 1: [250, .7, .75], 2: [430, .5, .4] };

  function card(p) {
    let c = cards.get(p.id);
    if (!c) {
      c = document.createElement("div");
      c.className = "card";
      c.append(Object.assign(document.createElement("img"), { alt: "" }),
        Object.assign(document.createElement("div"), { className: "name" }),
        Object.assign(document.createElement("div"), { className: "code" }));
      c.addEventListener("click", (e) => {
        e.stopPropagation();
        const i = shown.findIndex((x) => x.id === p.id);
        if (i === at) go(shown[at]); else { at = i; draw(); }
      });
      cards.set(p.id, c);
    }
    // Its desktop as last seen (thumbs.py), or its wallpaper.
    c.querySelector("img").src = `talaris-ui://thumb/?project=${encodeURIComponent(p.id)}&t=${stamp}`;
    c.querySelector(".name").textContent = p.name;
    c.querySelector(".code").textContent = p.code || "";
    c.classList.toggle("here", !!p.current);
    return c;
  }

  function draw() {
    const all = surface.projects || [];
    const q = typed.toLowerCase();
    // Anywhere in the name; the order stays most recent first.
    shown = q ? all.filter((p) => p.name.toLowerCase().includes(q)) : all;
    const n = shown.length;
    at = n ? ((at % n) + n) % n : 0;
    $("typed").replaceChildren(...(typed
      ? [document.createTextNode(n === 1 ? "1 project" : `${n} projects`), Object.assign(document.createElement("b"), { textContent: typed })]
      : [document.createTextNode("Projects — type to find one")]));
    const ring = $("ring");
    const live = new Set(shown.map((p) => p.id));
    for (const [id, c] of cards) if (!live.has(id)) { c.remove(); cards.delete(id); }
    ring.querySelector(".none")?.remove();
    if (!n) { ring.append(Object.assign(document.createElement("div"), { className: "none", textContent: "No project has that in its name" })); return; }
    shown.forEach((p, i) => {
      const c = card(p);
      // The nearer way round: a ring of five or more turns; fewer just sit in a row.
      let d = i - at;
      if (n >= 5) { if (d > n / 2) d -= n; if (d < -n / 2) d += n; }
      const [x, scale, opacity] = SLOTS[Math.abs(d)] || [Math.sign(d) * 560, .4, 0];
      c.style.transform = `translateX(${Math.sign(d) * x}px) scale(${scale})`;
      c.style.opacity = String(opacity);
      c.style.zIndex = String(10 - Math.abs(d));
      c.style.pointerEvents = opacity ? "" : "none";
      c.classList.toggle("front", d === 0);
      if (!c.parentNode) ring.append(c);
    });
  }
  function turn(by) { if (shown.length) { at += by; draw(); } }
  function go(p) { if (p && bridge) bridge.choose(p.id); }

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (k === "Escape") { e.preventDefault(); if (bridge) bridge.file(); }
    else if (k === "ArrowRight" || (k === "Tab" && !e.shiftKey)) { e.preventDefault(); turn(1); }
    else if (k === "ArrowLeft" || (k === "Tab" && e.shiftKey)) { e.preventDefault(); turn(-1); }
    else if (k === "Enter") { e.preventDefault(); go(shown[at]); }
    else if (k === "Backspace") { e.preventDefault(); if (typed) { typed = typed.slice(0, -1); at = 0; draw(); } }
    else if (k.length === 1 && !e.altKey) {
      e.preventDefault();
      typed += k;
      at = 0;
      draw();
      // Narrowed to one: that one, a beat after it is seen.
      if (shown.length === 1) { const only = shown[0]; setTimeout(() => { if (shown.length === 1 && shown[0] === only) go(only); }, 160); }
    }
  });
  // The wheel turns it too, a notch at a time.
  let wheelAt = 0;
  document.addEventListener("wheel", (e) => {
    const now = Date.now();
    if (now - wheelAt < 120) return;
    wheelAt = now;
    turn((e.deltaY || e.deltaX) > 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener("pointerdown", (e) => { if (e.target === document.documentElement || e.target === document.body) { if (bridge && surface.up) bridge.file(); } });
  window.pressedAt = (x, y) => {
    const hit = document.elementFromPoint(x, y);
    if (bridge && surface.up && (hit === document.documentElement || hit === document.body)) bridge.file();
  };
  for (const t of ["pointerdown", "keydown", "wheel"]) addEventListener(t, () => bridge && bridge.activity(), { capture: true, passive: true });

  function how() {
    const m = surface.motion || {};
    return { kind: m.motion, speed: m.speed, edge: "top", flush: false, backdrop: document.documentElement, viewport: surface.viewport,
      shown: () => bridge && bridge.drawn() };
  }
  function onState(s) {
    const was = surface;
    surface = s;
    if (s.up && !was.up) {
      // Fresh each time: nothing typed, turned to the one before this (the current is first).
      typed = "";
      stamp = Date.now();
      at = (s.projects || []).length > 1 ? 1 : 0;
      for (const c of cards.values()) c.remove();
      cards.clear();
      draw();
      // Placed where they start, then allowed to move: the first drawing does not slide in from nowhere.
      for (const c of cards.values()) c.style.transition = "none";
      requestAnimationFrame(() => { for (const c of cards.values()) c.style.transition = ""; });
      Motion.arrive($("panel"), how());
    } else if (s.up) draw();
  }
  Surface.connect({ onState }).then((b) => {
    bridge = b;
    b.step.connect((by) => { if (surface.up) turn(by); });
    b.leave.connect(() => {
      surface = { ...surface, up: false };
      const going = Motion.leave($("panel"), how());
      if (going) going.onfinish = () => bridge.left(); else bridge.left();
    });
  });
})();
</script>
</body>
</html>

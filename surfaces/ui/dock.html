<html>
<head>
<meta charset="utf-8">
<title>Talaris dock</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
body { display: flex; align-items: flex-end; justify-content: center; }
body[data-edge="top"] { align-items: flex-start; }
/* A panel in the middle of the edge, not a strip across it: the dock is a
   place you look at, the bar is a frame. */
#dock {
  display: flex; align-items: flex-end; overflow: visible; gap: 2px; height: calc(var(--icon, 24px) + 20px); margin: 0 0 3px; padding: 0 8px;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent);
  border: 1px solid var(--frame); border-radius: 12px;
}
body[data-edge="top"] #dock { margin: 3px 0 0; }
body[data-outline="none"] #dock { border-color: transparent; }
body[data-outline="accent"] #dock { border-color: var(--accent); }
body[data-shadow] #dock { box-shadow: 0 -2px 10px rgba(0, 0, 0, .45), 0 0 2px rgba(0, 0, 0, .3); }
/* Pills: a dock each for the pinned everywhere, the pinned here, and the open — the
   dock itself only a row of them, each drawn as the dock is. */
body[data-groups="pills"] #dock { background: none; border-color: transparent !important; box-shadow: none !important; padding: 0; gap: 8px; align-items: flex-end; }
.pill { display: flex; align-items: flex-end; gap: 2px; height: 100%; padding: 0 8px; box-sizing: border-box;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); border: 1px solid var(--frame); border-radius: 12px; }
body[data-outline="none"] .pill { border-color: transparent; }
body[data-outline="accent"] .pill { border-color: var(--accent); }
body[data-shadow] .pill { box-shadow: 0 -2px 10px rgba(0, 0, 0, .45), 0 0 2px rgba(0, 0, 0, .3); }
#dock:empty::after { content: "NOTHING OPEN"; font-size: 10px; letter-spacing: 3px; color: var(--muted); padding: 0 10px; }
/* Between the pinned and the rest. */
/* Pinned, then open: a rule a reader can find (the line color was lost on the dock's own). */
.rule { width: 2px; height: 60%; min-height: 18px; border-radius: 1px; background: var(--muted); opacity: .7; margin: 0 8px; align-self: center; }
/* Between what is pinned everywhere and what is pinned to this project only: lighter, dotted. */
.rule.here { width: 0; background: none; border-left: 2px dotted var(--muted); border-radius: 0; opacity: .6; margin: 0 6px; }
.app.hidden img, .app.hidden .letter { opacity: .4; }
/* No box on hover or focus: the icon's swell and its dots say which it is. */
.app, .app:hover, .app:focus, .app:focus-visible { border-color: transparent !important; background: transparent !important; outline: none !important; }
.app.dragging { opacity: .7; cursor: grabbing; }

.app { position: relative; width: calc((var(--icon, 24px) + 12px) * var(--s, 1)); height: calc((var(--icon, 24px) + 12px) * var(--s, 1)); padding: 0; align-self: flex-end; margin-bottom: 4px;
       transition: width .08s, height .08s; }
.app img, .app .letter { width: calc(var(--icon, 24px) * var(--s, 1)); height: calc(var(--icon, 24px) * var(--s, 1)); display: block; transition: width .08s, height .08s; }
body[data-edge="top"] .app { align-self: flex-start; margin-bottom: 0; margin-top: 4px; }
.app .letter { display: grid; place-content: center; border-radius: 6px; background: var(--accent-wash); color: var(--accent); font-size: 13px; }
/* A document: its application's icon with a corner badge — the page's own icon, or a sheet or a link drawn. */
.app .badge { position: absolute; right: calc(2px * var(--s, 1)); top: calc(2px * var(--s, 1)); width: calc(var(--icon, 24px) * .5 * var(--s, 1)); height: calc(var(--icon, 24px) * .5 * var(--s, 1));
  border-radius: 4px; background: var(--surface); box-shadow: 0 0 0 1px var(--frame); display: grid; place-items: center; overflow: hidden; }
.app .badge img { width: 80%; height: 80%; }
.app .badge.sheet::before { content: ""; width: 52%; height: 66%; border: 1.5px solid var(--text); border-radius: 1px;
  background: linear-gradient(var(--text), var(--text)) 50% 38% / 56% 1.5px no-repeat, linear-gradient(var(--text), var(--text)) 50% 62% / 56% 1.5px no-repeat; }
.app .badge.link::before { content: "↗"; font-size: calc(var(--icon, 24px) * .38 * var(--s, 1)); line-height: 1; color: var(--text); }
.app.missing img { opacity: .4; filter: grayscale(1); }
/* Something being dragged over: the dock says it will take it. */
body.dropping #dock, body.dropping .pill { border-color: var(--accent) !important; }
/* One dot per window, three at most; the focused one's a longer bar in the accent. */
.dots { position: absolute; left: 0; right: 0; bottom: 1px; display: flex; justify-content: center; gap: 3px; }
.dots i { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
.dots i.on { background: var(--accent); width: 16px; border-radius: 2px; }
</style>
</head>
<body data-edge="bottom">
<div id="dock"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="surface.js"></script>
<script src="dock.js"></script>
<script src="tips.js"></script>
</body>
</html>

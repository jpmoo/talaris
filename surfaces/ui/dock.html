<html>
<head>
<meta charset="utf-8">
<title>Talaris dock</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
body { display: flex; align-items: flex-end; justify-content: center; }
body[data-edge="top"] { align-items: flex-start; }
/* A panel in the middle of the edge, not a strip across it: the dock is a
   place you look at, the bar is a frame. */
#dock {
  display: flex; align-items: flex-end; overflow: visible; gap: 2px; height: calc(var(--icon, 24px) + 20px); margin: 0 0 3px; padding: 0 8px;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent);
  border: 1px solid var(--frame); border-radius: 12px;
}
body[data-edge="top"] #dock { margin: 3px 0 0; }
body[data-outline="none"] #dock { border-color: transparent; }
body[data-outline="accent"] #dock { border-color: var(--accent); }
body[data-shadow] #dock { box-shadow: 0 -2px 10px rgba(0, 0, 0, .45), 0 0 2px rgba(0, 0, 0, .3); }
#dock:empty::after { content: "NOTHING OPEN"; font-size: 10px; letter-spacing: 3px; color: var(--muted); padding: 0 10px; }
/* Between the pinned and the rest. */
.rule { width: 1px; height: 26px; background: var(--line); margin: 0 6px; align-self: center; }
.app.hidden img, .app.hidden .letter { opacity: .4; }
/* No box on hover or focus: the icon's swell and its dots say which it is. */
.app, .app:hover, .app:focus, .app:focus-visible { border-color: transparent !important; background: transparent !important; outline: none !important; }
.app.dragging { opacity: .7; cursor: grabbing; }

.app { position: relative; width: calc((var(--icon, 24px) + 12px) * var(--s, 1)); height: calc((var(--icon, 24px) + 12px) * var(--s, 1)); padding: 0; align-self: flex-end; margin-bottom: 4px;
       transition: width .08s, height .08s; }
.app img, .app .letter { width: calc(var(--icon, 24px) * var(--s, 1)); height: calc(var(--icon, 24px) * var(--s, 1)); display: block; transition: width .08s, height .08s; }
body[data-edge="top"] .app { align-self: flex-start; margin-bottom: 0; margin-top: 4px; }
.app .letter { display: grid; place-content: center; border-radius: 6px; background: var(--accent-wash); color: var(--accent); font-size: 13px; }
/* One dot per window, three at most; the focused one's a longer bar in the accent. */
.dots { position: absolute; left: 0; right: 0; bottom: 1px; display: flex; justify-content: center; gap: 3px; }
.dots i { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
.dots i.on { background: var(--accent); width: 16px; border-radius: 2px; }
</style>
</head>
<body data-edge="bottom">
<div id="dock"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="surface.js"></script>
<script src="dock.js"></script>
<script src="tips.js"></script>
</body>
</html>

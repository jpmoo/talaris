<html>
<head>
<meta charset="utf-8">
<title>Talaris launcher</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="motion.css">
<style>
html, body { height: 100%; }
body { background: rgba(0, 0, 0, .32); cursor: pointer; }
/* The dim is a button (a press there closes it); the box is not. */
#box { cursor: default; }
#box {
  /* Centered for its full size (the field, ten results, the foot), so that
     results arriving as you type grow it downward without moving it. */
  position: absolute; left: 50%; top: max(16px, calc(50% - 260px)); transform: translateX(-50%);
  width: min(640px, calc(100% - 32px));
  background: var(--surface); border: 1px solid var(--frame); border-radius: 12px;
  box-shadow: var(--menu-shadow); overflow: hidden;
}
#top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); }
#top .ic { width: 18px; height: 18px; flex: none; }
/* The box's own field: no frame of its own, the panel is its frame. */
#q, #q:focus {
  flex: 1; background: transparent !important; border: 0 !important; outline: none;
  color: var(--text) !important; font-size: 18px; letter-spacing: .3px; padding: 2px 0;
}
#q::placeholder { color: var(--muted); }
#scope { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }

#list { max-height: 440px; overflow: auto; padding: 4px; }
.item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--radius-row); cursor: pointer; }
.item.on { background: var(--accent-wash); }
.item .icon { width: 22px; height: 22px; flex: none; display: grid; place-content: center; color: var(--muted); }
.item .icon img { width: 22px; height: 22px; display: block; }
.item .icon .ic { width: 16px; height: 16px; }
.item.on .icon { color: var(--accent); }
.item .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item .title { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; letter-spacing: normal; font-size: 14px; }
.item .title b { color: var(--accent); font-weight: inherit; }
.item .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .kind { font-size: 10px; letter-spacing: 2px; color: var(--muted); flex: none; }
.item.on .kind { color: var(--accent); }
.item.armed .title { color: var(--danger); }
#foot { display: flex; justify-content: space-between; padding: 6px 14px; border-top: 1px solid var(--line); font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
#foot .err { color: var(--danger); letter-spacing: 1px; text-transform: none; font-size: 12px; }
</style>
</head>
<body>
<div id="box">
  <div id="top"><span id="glass"></span><input id="q" autocomplete="off" spellcheck="false"><span id="scope"></span></div>
  <div id="list"></div>
  <div id="foot"><span id="msg"></span><span>↑↓ choose · Enter open · Esc close</span></div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="icons.js"></script>
<script src="surface.js"></script>
<script src="motion.js"></script>
<script src="launcher.js"></script>
</body>
</html>

A dock item's menu: its windows on every desktop, to go to; show or hide,
pin or unpin, a new window here, what a press does when it is open only in
another project, close.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris dock menu</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
.menu { position: absolute; left: 4px; right: 4px; bottom: 6px; }
body[data-edge="top"] .menu { bottom: auto; top: 6px; }
.menu-item[hidden] { display: none !important; }
.menu-item { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#wins .hint.sub { padding-top: 4px !important; letter-spacing: 1px; text-transform: none; }
.menu-item.win { padding-left: 1.6em !important; }
.menu-item.on::before { content: "✓"; display: inline-block; width: 1.2em; margin-left: -1.2em; color: var(--accent); }
.menu-item.choice { padding-left: 1.6em !important; }
#wins:empty, #wins-hint[hidden], #choose[hidden] { display: none; }
.doc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none !important; letter-spacing: 0 !important; }
.doc-name[hidden] { display: none; }
</style>
</head>
<body>
<div class="menu" id="menu">
  <div class="hint" id="wins-hint" hidden>Its windows</div>
  <div id="wins"></div>
  <div id="goto"></div>
  <div class="menu-sep" id="wins-sep" hidden></div>
  <div class="hint" id="name"></div>
  <button class="menu-item" data-verb="show">Show</button>
  <button class="menu-item" data-verb="hide">Hide</button>
  <button class="menu-item" data-verb="open">Open</button>
  <button class="menu-item" data-verb="new">New window here</button>
  <button class="menu-item" data-verb="new-kept">New window in its project</button>
  <button class="menu-item" data-verb="pin-here">Pin to this project</button>
  <button class="menu-item" data-verb="pin-all">Pin to all projects</button>
  <button class="menu-item" data-verb="unpin">Unpin</button>
  <button class="menu-item" data-verb="keep-here">Keep in this project</button>
  <button class="menu-item" data-verb="unkeep">Stop keeping it here</button>
  <button class="menu-item" data-verb="bring-here">Always bring here</button>
  <button class="menu-item" data-verb="unbring">Stop always bringing here</button>
  <div id="choose" hidden>
    <div class="hint">Open in another project, a press…</div>
    <button class="menu-item choice" data-verb="elsewhere-new" data-choice="new">Opens a new window here</button>
    <button class="menu-item choice" data-verb="elsewhere-bring" data-choice="bring">Brings it here</button>
    <button class="menu-item choice" data-verb="elsewhere-go" data-choice="go">Goes to it</button>
  </div>
  <div class="hint doc-name" id="doc-name" hidden></div>
  <button class="menu-item" data-verb="doc-here">Pin this document to this project</button>
  <button class="menu-item" data-verb="doc-all">Pin this document to all projects</button>
  <div class="menu-sep" id="sep"></div>
  <button class="menu-item" data-verb="close">Close window</button>
  <button class="menu-item" data-verb="close-all">Close all windows</button>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="surface.js"></script>
<script>
"use strict";
let bridge = null;
let key = "";
const show = (verb, yes) => { document.querySelector(`[data-verb="${verb}"]`).hidden = !yes; };
// Only what can be done to this item: Show only if something is hidden, Pin
// only with a launcher to start it again by, Close all only with two or more.
function onState(s) {
  if (!s.up) return;
  const it = s.item || {};
  key = it.key || "";
  const doc = !!it.doc;
  // Its name, and how it stands: pinned where, and its exception to the general rule.
  const where = it.pinned ? (it.pinnedWhere === "all" ? "pinned to all projects" : "pinned to this project") : "not pinned";
  const rule = it.keptHere ? ", kept here" : it.keptIn ? ", kept in another project" : it.brought ? ", always brought here" : "";
  document.getElementById("name").textContent = `${doc ? `${it.name} · ${it.appName || "opens by default"}` : it.name || ""} — ${where}${rule}`;
  const wins = it.windows || [];
  show("show", wins.some((w) => w.hidden));
  show("hide", wins.some((w) => !w.hidden));
  // A document opens; an application starts a new window.
  show("open", doc && !it.doc.missing);
  show("new", !doc && !!it.id);
  // Kept in another project: a new window there, too — that project gone to.
  show("new-kept", !doc && !!it.id && !!s.keptName);
  if (s.keptName) document.querySelector('[data-verb="new-kept"]').textContent = `New window in ${s.keptName}`;
  // Pinned in one way, it can be moved to the other.
  show("pin-here", (doc || !!it.id) && it.pinnedWhere !== "here");
  show("pin-all", (doc || !!it.id) && it.pinnedWhere !== "all");
  // The document a window of this application shows, where it can be told.
  const found = s.found;
  show("doc-here", !doc && !!found);
  show("doc-all", !doc && !!found);
  // The document named on a line of its own (cut short only there), so the two pins say all they do.
  const docName = document.getElementById("doc-name");
  docName.hidden = !(!doc && found);
  if (found) {
    docName.textContent = `“${found.name}”`;
    docName.title = found.name;
    document.querySelector('[data-verb="doc-here"]').textContent = "Pin it to this project";
    document.querySelector('[data-verb="doc-all"]').textContent = "Pin it to all projects";
  }
  show("unpin", !!it.pinned);
  // Kept in a project: gone to there when called, not brought.
  // Its exception to the general rule (Settings, Keys): kept where the rule brings, brought where it goes.
  show("keep-here", !!it.pinned && it.rule === "bring" && !it.keptHere);
  show("unkeep", !!it.pinned && it.rule === "bring" && !!it.keptIn);
  show("bring-here", !!it.pinned && it.rule === "go" && !it.brought);
  show("unbring", !!it.pinned && it.rule === "go" && !!it.brought);
  if (it.keptIn && !it.keptHere) document.querySelector('[data-verb="unkeep"]').textContent = "Stop keeping it in its project";
  else document.querySelector('[data-verb="unkeep"]').textContent = "Stop keeping it here";
  // Bring and go are one choice now, below; the old exceptions are not offered again.
  show("bring-here", false);
  show("unbring", false);
  // Every window of it, on every desktop, each with its project: one pressed is gone to. Only when there are two or more.
  const all = s.everywhere || [];
  const list = document.getElementById("wins");
  // Grouped by where they are: here first, then each other project by name, the hidden last.
  const groups = new Map();
  const whereOf = (w) => (w.hidden ? "Hidden" : w.here ? "Here" : w.project || "Another desktop");
  for (const w of all.length > 1 ? all : []) groups.set(whereOf(w), [...(groups.get(whereOf(w)) || []), w]);
  const order = [...groups.keys()].sort((a, b) => (a === "Here" ? -1 : b === "Here" ? 1 : a === "Hidden" ? 1 : b === "Hidden" ? -1 : a.localeCompare(b)));
  list.replaceChildren(...order.flatMap((where) => {
    const head = document.createElement("div");
    head.className = "hint sub";
    head.textContent = where;
    return [head, ...groups.get(where).map((w) => {
      const b = document.createElement("button");
      b.className = "menu-item win";
      b.textContent = w.title || it.name || "Window";
      b.title = `${w.title} — ${where}`;
      b.addEventListener("click", () => bridge && bridge.act(`go:${w.address}`, key));
      return b;
    })];
  }));
  // The other projects it is open or kept in: each gone to by a press.
  document.getElementById("goto").replaceChildren(...(s.goTo || []).map((p) => {
    const b = document.createElement("button");
    b.className = "menu-item";
    b.textContent = `Go to ${p.name}`;
    b.addEventListener("click", () => bridge && bridge.act(`project:${p.id}`, key));
    return b;
  }));
  document.getElementById("wins-hint").hidden = all.length < 2;
  document.getElementById("wins-sep").hidden = all.length < 2 && !(s.goTo || []).length;
  // What a press does when it is open only in another project: ticked as it is now; the one ticked, pressed, goes back to the default.
  const choose = !doc && !!it.id;
  document.getElementById("choose").hidden = !choose;
  if (choose) {
    const now = s.elsewhere || (it.rule === "go" ? "go" : "bring");
    // One that keeps a single window cannot have another.
    document.querySelector('[data-choice="new"]').hidden = !!s.oneWindow;
    // Of an app with many windows, a press brings the one last used, not all of it.
    document.querySelector('[data-choice="bring"]').textContent = s.manyWindows ? "Brings its last window here" : "Brings it here";
    for (const c of ["new", "bring", "go"]) {
      const b = document.querySelector(`[data-choice="${c}"]`);
      b.classList.toggle("on", now === c);
      b.dataset.verb = now === c && s.chosen === c ? "elsewhere-rule" : `elsewhere-${c}`;
    }
  }
  show("close", wins.length === 1);
  show("close-all", wins.length > 1);
  document.getElementById("sep").hidden = !wins.length;
}
for (const b of document.querySelectorAll(".menu-item")) b.addEventListener("click", () => bridge && bridge.act(b.dataset.verb, key));
addEventListener("keydown", (e) => { if (e.key === "Escape" && bridge) bridge.file(); });
addEventListener("blur", () => { if (bridge) bridge.file(); });
Surface.connect({ onState }).then((b) => { bridge = b; });
</script>
</body>
</html>

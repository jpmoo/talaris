A dock item's windows, each as it last looked (dock.py, DockPreview): a press
on one goes to it or brings it, as that application's setting says.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
html, body { margin: 0; height: 100%; background: transparent !important; overflow: hidden; }
#row { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 8px; justify-content: center; }
body[data-edge="top"] #row { bottom: auto; top: 8px; }
.win { width: 180px; flex: none; padding: 6px; border: 1px solid var(--frame); border-radius: var(--radius-panel); cursor: pointer; text-align: left;
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent); color: var(--text); font: inherit; }
.win:hover { border-color: var(--accent); }
.pic { display: block; width: 100%; height: 104px; object-fit: cover; object-position: top; border-radius: var(--radius-row); background: var(--accent-wash); }
.none { display: grid; place-content: center; color: var(--muted); font-size: 11px; }
.t { display: block; margin-top: 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="row"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="surface.js"></script>
<script>
"use strict";
let bridge = null;
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
function onState(s) {
  document.body.dataset.edge = s.edge || "bottom";
  document.body.style.setProperty("--alpha", `${s.opacity ?? 100}%`);
  document.getElementById("row").replaceChildren(...(s.windows || []).map((w) => {
    const b = el("button", "win");
    b.title = w.title || "";
    if (w.image) { const i = el("img", "pic"); i.alt = ""; i.src = `data:image/png;base64,${w.image}`; b.append(i); }
    else b.append(el("span", "pic none", "Not seen yet"));
    b.append(el("span", "t", w.title || "Untitled"), el("span", "w", w.hidden ? "Hidden" : w.here ? "Here" : w.project));
    b.addEventListener("click", () => bridge && bridge.pick(w.address));
    return b;
  }));
}
Surface.connect({ onState }).then((b) => { bridge = b; });
</script>
</body>
</html>

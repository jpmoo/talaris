<html>
<head>
<meta charset="utf-8">
<title>Talaris bar</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
#bar {
  height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 8px; border-bottom: 1px solid var(--frame);
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent);
}
body[data-edge="bottom"] #bar { border-bottom: 0; border-top: 1px solid var(--frame); }
/* Floating: off the edges by the inset, framed all round, its corners rounded. */
body[data-shape="floating"] #bar {
  margin: var(--inset) var(--inset) 0; height: calc(100% - var(--inset));
  border: 1px solid var(--frame); border-radius: 12px;
}
body[data-shape="floating"][data-edge="bottom"] #bar { margin: 0 var(--inset) var(--inset); }
.side { display: flex; align-items: center; gap: 4px; min-width: 0; }
.side.end { justify-content: flex-end; }


/* Where you are: the project, letter-spaced like every label, with its code. */
#where { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text); white-space: nowrap; }
#where .code { color: var(--muted); margin-left: 10px; letter-spacing: 2px; }

/* Morgan's button says what Morgan is doing. Listening breathes; thinking
   turns a quarter-arc round the ring; speaking breathes faster. Idle is still;
   dimmed, Morgan is not running. */
#morgan { position: relative; }
#morgan.absent { opacity: .45; }
#morgan .arc { position: absolute; inset: 4px; border-radius: 50%; border: 1.5px solid transparent; display: none; }
#morgan[data-state="thinking"] .arc, #morgan[data-state="consulting"] .arc {
  display: block; border-top-color: var(--accent); animation: turn 1s linear infinite;
}
#morgan[data-state="listening"], #morgan[data-state="transcribing"], #morgan[data-state="speaking"] { color: var(--accent); }
#morgan[data-state="listening"] .ic, #morgan[data-state="transcribing"] .ic { animation: breathe 1.6s ease-in-out infinite; }
#morgan[data-state="speaking"] .ic { animation: breathe .7s ease-in-out infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(.8); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { #morgan * { animation: none !important; } }

#clock { font-size: 13px; letter-spacing: 1px; color: var(--text); padding: 0 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#clock .day { color: var(--muted); margin-right: 8px; }
.sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.ic { width: 16px; height: 16px; display: block; }
</style>
</head>
<body data-edge="top">
<div id="bar">
  <div class="side">
    <button id="ask" class="bar-item" title="Find anything, or ask (Super+Space)"></button>
    <button id="morgan" class="bar-item absent" title="Morgan"><span id="morgan-ic"></span><span class="arc"></span></button>
  </div>
  <div id="where"></div>
  <div class="side end">
    <button id="net" class="bar-item" title=""></button>
    <button id="bt" class="bar-item" title=""></button>
    <button id="vol" class="bar-item" title=""><span id="vol-ic"></span><span class="n" id="vol-n"></span></button>
    <span id="bat" class="bar-item static" title=""><span id="bat-ic"></span><span class="n" id="bat-n"></span></span>
    <span class="sep"></span>
    <span id="clock"><span class="day" id="day"></span><span id="time"></span></span>
    <button id="settings" class="bar-item" title="Settings"></button>
    <button id="power" class="bar-item" title="Power"></button>
  </div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="icons.js"></script>
<script src="surface.js"></script>
<script src="bar.js"></script>
</body>
</html>

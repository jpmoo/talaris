The bar. Left: the way to anything — the launcher's box and Morgan beside it — and
where you are. Middle: the date and the time. Right: the machine, and the way out.
-->
<html>
<head>
<meta charset="utf-8">
<title>Talaris bar</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
#bar {
  height: calc(100% - var(--room, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 8px; border-bottom: 1px solid var(--frame);
  background: color-mix(in srgb, var(--surface) var(--alpha, 100%), transparent);
}
body[data-edge="bottom"] #bar { border-bottom: 0; border-top: 1px solid var(--frame); margin-top: var(--room, 0px); }
body[data-outline="none"] #bar { border-color: transparent !important; }
body[data-outline="accent"] #bar { border-color: var(--accent) !important; }
body[data-shadow] #bar { box-shadow: 0 3px 10px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .3); }
body[data-shadow][data-edge="bottom"] #bar { box-shadow: 0 -3px 10px rgba(0, 0, 0, .45), 0 -1px 2px rgba(0, 0, 0, .3); }
/* Floating: off the screen's edges by its margins, framed all round, rounded.
   The margin on the far side is the space to the windows, which Hyprland's
   gap keeps; here only the near side and the two ends are the bar's to leave. */
body[data-shape="floating"] #bar {
  margin: var(--m-top) var(--m-right) 0 var(--m-left); height: calc(100% - var(--m-top) - var(--room, 0px));
  border: 1px solid var(--frame); border-radius: 12px;
}
body[data-shape="floating"][data-edge="bottom"] #bar { margin: var(--room, 0px) var(--m-right) var(--m-bottom) var(--m-left); height: calc(100% - var(--m-bottom) - var(--room, 0px)); }
.side { display: flex; align-items: center; gap: var(--bar-gap, 4px); min-width: 0; }
.bar-hidden { display: none !important; }
.side.end { justify-content: flex-end; }


/* Where you are: the project, letter-spaced like every label, with its code. */
#where { cursor: pointer; padding: 4px 8px; border: 1px solid transparent; border-radius: var(--radius-control); }
#where:hover, #where:hover .code { color: var(--accent); }
#where.on { border-color: var(--accent); background: var(--accent-wash); }
#where { margin-left: 4px; overflow: hidden; text-overflow: ellipsis; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--text); white-space: nowrap; }
#where .code { color: var(--muted); margin-left: 10px; letter-spacing: 2px; }
#where .code.alone { margin-left: 0; color: var(--text); }

/* Morgan's button says what Morgan is doing. Listening breathes; thinking
   turns a quarter-arc round the ring; speaking breathes faster. Idle is still;
   dimmed, Morgan is not running. */
#morgan { position: relative; }
#morgan.absent { opacity: .45; }
#morgan .arc { position: absolute; inset: 4px; border-radius: 50%; border: 1.5px solid transparent; display: none; }
#morgan[data-state="thinking"] .arc, #morgan[data-state="consulting"] .arc {
  display: block; border-top-color: var(--accent); animation: turn 1s linear infinite;
}
#morgan[data-state="listening"], #morgan[data-state="transcribing"], #morgan[data-state="speaking"] { color: var(--accent); }
#morgan[data-state="listening"] .ic, #morgan[data-state="transcribing"] .ic { animation: breathe 1.6s ease-in-out infinite; }
#morgan[data-state="speaking"] .ic { animation: breathe .7s ease-in-out infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(.8); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { #morgan * { animation: none !important; } }

/* One center line for everything: icons, their numbers, the clock, each its
   own box centered by flex. The text keeps the font's own line height —
   squeezed to its size, descenders hung below the box and were cut off. */
.bar-item .n, #clock span { display: block; line-height: normal; }
/* In a button the number sat a part pixel low and lost its bottom row: a pixel of room. */
.bar-item .n { padding-bottom: 2px; font-size: 13px; position: relative; top: 1px; }
#where { padding-bottom: 2px; }
#clock { display: flex; align-items: center; height: var(--control); }
#clock { font-size: 13px; letter-spacing: 1px; color: var(--text); padding: 0 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#clock .day { color: var(--muted); margin-right: 8px; }
#clock { cursor: pointer; border: 1px solid transparent; border-radius: var(--radius-control); }
#clock:hover, #clock:hover .day, #clock.on .day { color: var(--accent); }
#clock.on { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); }
.sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.ic { width: 16px; height: 16px; display: block; }
/* The tray: running applications' own icons, in their own colors, a little
   quieter until the pointer is on them; one asking for attention is not. */
#tray { display: flex; align-items: center; gap: 2px; }
#tray:not(:empty) { margin-right: 4px; }
.tray-item img { width: 16px; height: 16px; display: block; opacity: .85; }
.tray-item:hover img, .tray-item.attention img { opacity: 1; }
.tray-item.attention { border-color: var(--accent); }
</style>
</head>
<body data-edge="top">
<div id="bar">
  <div class="side">
    <button id="ask" class="bar-item" title="Find anything, or ask (Super+Space)"></button>
    <button id="morgan" class="bar-item absent" title="Morgan"><span id="morgan-ic"></span><span class="arc"></span></button>
    <button id="people" class="bar-item" title="People — coming"></button>
    <button id="tasks" class="bar-item" title="Tasks — coming"></button>
    <button id="canvas" class="bar-item" title="Canvas (Super+Alt+C)"></button>
    <button id="writing" class="bar-item" title="Writing (Super+Alt+W)"></button>
    <div id="where"></div>
  </div>
  <span id="clock"><span class="day" id="day"></span><span id="time"></span></span>
  <div class="side end">
    <span id="tray"></span>
    <button id="net" class="bar-item" title=""></button>
    <button id="bt" class="bar-item" title=""></button>
    <button id="vol" class="bar-item" title=""><span id="vol-ic"></span><span class="n" id="vol-n"></span></button>
    <button id="bat" class="bar-item" title=""><span id="bat-ic"></span><span class="n" id="bat-n"></span></button>
    <span class="sep"></span>
    <button id="settings" class="bar-item" title="Settings"></button>
    <button id="power" class="bar-item" title="Power"></button>
  </div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="icons.js"></script>
<script src="surface.js"></script>
<script src="bar.js"></script>
<script src="tips.js"></script>
</body>
</html>

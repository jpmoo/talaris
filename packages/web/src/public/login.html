<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Talaris</title>
<!-- The phone's light or dark, in Talaris's own palette for each (tokens.css's data-mode). -->
<script>(() => { const q = matchMedia("(prefers-color-scheme: light)"); const set = () => { document.documentElement.dataset.mode = q.matches ? "light" : "dark"; }; set(); q.addEventListener("change", set); })();</script>
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="web/login.css">
</head>
<body>
<main>
  <h1>Talaris</h1>
  <section id="signin">
    <p>Sign in with your passkey.</p>
    <button id="go">Sign in</button>
    <button class="quiet" id="to-add">Add a passkey</button>
  </section>
  <section id="add" hidden>
    <p>A passkey for this device. The code comes from <code>talaris-web passkey</code> on home-server.</p>
    <input id="code" autocomplete="one-time-code" placeholder="Code" spellcheck="false">
    <input id="name" placeholder="This device's name (iPhone, the XPS…)" spellcheck="false">
    <button id="add-go">Add it</button>
    <button class="quiet" id="to-signin">Back</button>
  </section>
  <div class="say" id="say"></div>
</main>
<script src="web/passkeys.js"></script>
<script src="web/login.js"></script>
</body>
</html>

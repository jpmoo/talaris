# Hermes Notes sync: tasks, projects, people and undated notes — and their
# attachments — kept in step between
# Talaris and Hermes Notes, through pkm-interchange alone — an implementation
# of the format of its own, knowing neither app's field names.

id = "hermes-sync"
name = "Hermes Notes sync"
version = "0.1.0"
description = "Keeps tasks, projects, people, unaffiliated notes and daily notes, with their attachments, in step with Hermes Notes."
author = "Jeff Moore"
license = "GPL-3.0-only"
command = ["node", "main.mjs"]

[[tools]]
name = "sync_now"
description = "Sync with Hermes Notes now, rather than at the next interval"

[[tools]]
name = "restore_files"
description = "Put back linked files deleted from disk, from the copies Hermes Notes holds"

[[tools]]
name = "sync_status"
description = "When it last synced, what it carried, and what waits to be decided"

# Hermes Notes itself, in a window of its own, on a key.
[[apps]]
id = "hermes"
name = "Hermes Notes"
url = "{server}"
key = "SUPER SHIFT, H"
icon = "icon.png"

# What a backup of Talaris carries of this plugin besides its settings (never
# the access key): which Talaris thing is which Hermes Notes one, and what
# each pair last agreed on — so a revived Talaris picks up where it left off.
[backup]
state = ["state.json"]

[permissions]
read = ["task", "project", "person", "note"]
write = ["task", "project", "person", "note"]
notify = true
network = ["your Hermes Notes server"]

[[settings]]
key = "server"
label = "Hermes Notes address"
kind = "text"
help = "Where you open Hermes Notes, e.g. https://example.org/hermesnotes. https only: the access key goes with every request."

[[settings]]
key = "key"
label = "Access key"
kind = "secret"
help = "A Hermes Notes access key (Settings, Access keys in Hermes Notes)."

[[settings]]
key = "mode"
label = "When they differ"
kind = "choice"
choices = ["Merge, and ask me", "Hermes Notes wins", "Talaris wins"]
default = "Merge, and ask me"
help = "Merge carries each change across and asks when both changed. A side that wins makes the other match it."

[[settings]]
key = "tasks"
label = "Tasks"
kind = "boolean"
default = true

[[settings]]
key = "projects"
label = "Projects"
kind = "boolean"
default = true

[[settings]]
key = "people"
label = "People"
kind = "choice"
choices = ["Off", "Only those Hermes Notes has", "Everyone"]
default = "Only those Hermes Notes has"
help = "Talaris keeps whole address books; Everyone sends them all to Hermes Notes."

[[settings]]
key = "notes"
label = "Notes"
kind = "choice"
choices = ["Off", "All notes", "Only those with these tags"]
default = "Off"
help = "Talaris's unaffiliated notes (those of no project) and Hermes Notes' notes (not its daily pages). Where a note sits among Talaris's unaffiliated notes stays in Talaris."

[[settings]]
key = "noteTags"
label = "Note tags"
kind = "text"
default = "talaris"
help = "For Only those with these tags: comma-separated. A note on either side takes part by wearing one — in Talaris, tag it in the writing drawer."

[[settings]]
key = "dailyNotes"
label = "Daily notes"
kind = "boolean"
default = false
help = "Talaris's daily notes (Home's) and Hermes Notes' daily pages, paired by their day. A day with no words is not made on the other side. Hermes Notes takes a day only once it has a daily page of its own (open Today there once)."

[[settings]]
key = "minutes"
label = "Every (minutes)"
kind = "number"
default = 5
help = "When nothing has changed, a sync is two small questions; it reads everything only when something has."

[[settings]]
key = "buttons"
label = "Sync now buttons"
kind = "boolean"
default = true
help = "Sync now on each person, task and project, and Sync all at the top of People and of Tasks. Each runs the ordinary sync — everything that changed, not only that one — which is quick."

# The buttons the setting above puts on Talaris's sheets and lists.
[[actions]]
id = "sync"
label = "Sync with Hermes Notes"
on = ["person", "task", "project", "note"]
tool = "sync_now"
when = "buttons"

[[actions]]
id = "sync-people"
label = "Sync all with Hermes Notes"
on = ["people"]
tool = "sync_now"
when = "buttons"

[[actions]]
id = "sync-tasks"
label = "Sync all with Hermes Notes"
on = ["tasks"]
tool = "sync_now"
when = "buttons"

[[actions]]
id = "sync-notes"
label = "Sync all with Hermes Notes"
on = ["notes"]
tool = "sync_now"
when = "buttons"

[[actions]]
id = "sync-daily"
label = "Sync all with Hermes Notes"
on = ["daily"]
tool = "sync_now"
when = ["buttons", "dailyNotes"]

[[actions]]
id = "restore"
label = "Restore missing files"
on = ["person", "task", "project"]
tool = "restore_files"
when = "buttons"
only = "missing-files"
